name: Demo internal API keys audit

on:
  workflow_dispatch:

concurrency:
  group: demo-environment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: demo
    env:
      PREVIEW_HOST: ${{ vars.DEMO_HOST }}
      PREVIEW_ROOT: ${{ vars.DEMO_ROOT || '/srv/yawp-demo' }}
      PREVIEW_SSH_USER: ${{ vars.DEMO_SSH_USER || 'ec2-user' }}
    steps:
      - name: Check audit configuration
        env:
          DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable DEMO_HOST"; exit 1; }
          test -n "$DEMO_SSH_PRIVATE_KEY" || { echo "Missing repository secret DEMO_SSH_PRIVATE_KEY"; exit 1; }
          [[ "$PREVIEW_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEMO_ROOT"; exit 1; }

      - name: Checkout reviewed audit scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prepare SSH
        env:
          DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: bash scripts/preview/prepare-demo-ssh.sh

      - name: Audit live demo internal API keys
        id: audit
        run: |
          set -euo pipefail
          shell_quote() { printf '%q' "$1"; }
          validate_audit_output() {
            local output="$1"
            local count_line count entry_count
            count_line="${output%%$'\n'*}"
            [[ "$count_line" =~ ^count=[0-9]+$ ]] || {
              echo "Audit output missing a valid count line" >&2
              return 1
            }
            count="${count_line#count=}"
            entry_count="$(printf '%s\n' "$output" | grep -c '^entry' || true)"
            [[ "$entry_count" == "$count" ]] || {
              echo "Audit entry count ($entry_count) does not match count=$count" >&2
              return 1
            }
          }
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_root="$(shell_quote "$PREVIEW_ROOT")"
          host_script="scripts/preview/audit-demo-internal-api-keys-on-host.sh"
          audit_config="scripts/preview/demo-internal-api-config.mjs"
          audit_module="scripts/preview/demo-internal-api-key-audit.mjs"
          audit_cli="scripts/preview/print-demo-internal-api-key-audit.cli.mjs"
          remote_audit_dir="/tmp/yawp-key-audit-${GITHUB_RUN_ID}"
          web_container="$(
            ssh -i ~/.ssh/demo_key -o BatchMode=yes -o ConnectTimeout=20 "$ssh_target" \
              "PREVIEW_ROOT=${remote_root} bash -s" < "$host_script"
          )"
          [[ "$web_container" =~ ^[a-f0-9]{12,64}$ ]] || {
            echo "Unexpected demo web container id" >&2
            exit 1
          }
          ssh -i ~/.ssh/demo_key -o BatchMode=yes -o ConnectTimeout=20 "$ssh_target" \
            "mkdir -p $(shell_quote "$remote_audit_dir") && chmod 700 $(shell_quote "$remote_audit_dir")"
          ssh -i ~/.ssh/demo_key -o BatchMode=yes -o ConnectTimeout=20 "$ssh_target" \
            "docker exec -i $(shell_quote "$web_container") sh -ec 'mkdir -p /tmp/yawp-key-audit && chmod 700 /tmp/yawp-key-audit'" \
            < /dev/null
          ssh -i ~/.ssh/demo_key -o BatchMode=yes -o ConnectTimeout=20 "$ssh_target" \
            "docker exec -i $(shell_quote "$web_container") sh -ec 'cat > /tmp/yawp-key-audit/demo-internal-api-config.mjs'" \
            < "$audit_config"
          ssh -i ~/.ssh/demo_key -o BatchMode=yes -o ConnectTimeout=20 "$ssh_target" \
            "docker exec -i $(shell_quote "$web_container") sh -ec 'cat > /tmp/yawp-key-audit/demo-internal-api-key-audit.mjs'" \
            < "$audit_module"
          audit_output="$(
            ssh -i ~/.ssh/demo_key -o BatchMode=yes -o ConnectTimeout=20 "$ssh_target" \
              "docker exec -i $(shell_quote "$web_container") sh -ec 'cd /tmp/yawp-key-audit && bun run -'" \
              < "$audit_cli"
          )"
          ssh -i ~/.ssh/demo_key -o BatchMode=yes -o ConnectTimeout=20 "$ssh_target" \
            "rm -rf $(shell_quote "$remote_audit_dir"); docker exec $(shell_quote "$web_container") rm -rf /tmp/yawp-key-audit" \
            < /dev/null || true
          validate_audit_output "$audit_output"
          printf '%s\n' "$audit_output"
          audit_delim="audit_$(openssl rand -hex 16)"
          {
            printf 'audit<<%s\n' "$audit_delim"
            printf '%s\n' "$audit_output"
            printf '%s\n' "$audit_delim"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          AUDIT_OUTPUT: ${{ steps.audit.outputs.audit }}
        run: |
          set -euo pipefail
          printf '%s\n' "$AUDIT_OUTPUT"
          count_line="${AUDIT_OUTPUT%%$'\n'*}"
          count="${count_line#count=}"
          {
            echo "### Demo internal API keys audit"
            echo
            echo "**Entry count:** $count"
            echo
            echo "| id | scopes | fields |"
            echo "| --- | --- | --- |"
            while IFS= read -r line; do
              [[ "$line" == entry$'\t'* ]] || continue
              IFS=$'\t' read -r _ id scopes fields <<<"$line"
              echo "| \`$id\` | \`$scopes\` | \`$fields\` |"
            done <<<"$AUDIT_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"
