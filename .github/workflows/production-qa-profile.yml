name: Production QA Profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-production-qa-profile:
    name: Ensure production QA profile
    runs-on: ubuntu-22.04
    environment:
      name: production
      url: https://yawp.school

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Prepare production bastion SSH key
        run: |
          mkdir -p ~/.ssh "$(dirname "${PROD_SSH_KEY_PATH}")"
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > "${PROD_SSH_KEY_PATH}"
          chmod 600 "${PROD_SSH_KEY_PATH}"

          scanned_key="$(ssh-keyscan -t ed25519 "${PROD_SSH_HOST}" 2>/dev/null \
            | awk '$2 == "ssh-ed25519" { print; exit }')"
          test -n "${scanned_key}"
          observed_fingerprint="$(printf '%s\n' "${scanned_key}" \
            | ssh-keygen -lf - -E sha256 \
            | awk '{ print $2 }')"
          if [[ -z "${PROD_SSH_HOST_FINGERPRINT}" ]]; then
            echo "::error::PROD_SSH_HOST_FINGERPRINT is not configured. Observed ${observed_fingerprint}."
            exit 1
          fi
          if [[ "${observed_fingerprint}" != "${PROD_SSH_HOST_FINGERPRINT}" ]]; then
            echo "::error::Production bastion host key mismatch. Observed ${observed_fingerprint}."
            exit 1
          fi
          printf '%s\n' "${scanned_key}" > ~/.ssh/known_hosts
          ssh-keygen -H -f ~/.ssh/known_hosts
          rm -f ~/.ssh/known_hosts.old
        env:
          PROD_SSH_KEY_PATH: ${{ runner.temp }}/yawp-production-bastion
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PROD_SSH_HOST_FINGERPRINT }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Generate Prisma client
        run: bun prisma:generate

      - name: Ensure production QA profile
        run: bun run --cwd packages/prisma production-qa-profile-remote production
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_QA_PASSWORD: ${{ secrets.PROD_QA_PASSWORD }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY_PATH: ${{ runner.temp }}/yawp-production-bastion

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify released-grade editing and activity in production
        run: bun run --cwd services/web-app production-qa-released-grade
        env:
          PROD_QA_BASE_URL: https://yawp.school
          PROD_QA_PASSWORD: ${{ secrets.PROD_QA_PASSWORD }}

      - name: Verify production migration and disposable fixture post-state
        run: |
          set -o pipefail
          mkdir -p services/web-app/test-results
          bun run --cwd packages/prisma production-qa-profile-remote production-postcheck \
            | tee services/web-app/test-results/production-qa-database-postcheck.json
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_QA_PASSWORD: ${{ secrets.PROD_QA_PASSWORD }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY_PATH: ${{ runner.temp }}/yawp-production-bastion

      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-released-grade-activity
          path: services/web-app/test-results/production-*
          if-no-files-found: warn
