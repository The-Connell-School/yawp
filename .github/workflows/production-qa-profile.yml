name: Production QA Profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-production-qa-profile:
    name: Ensure production QA profile
    runs-on: ubuntu-22.04
    environment:
      name: production
      url: https://yawp.school

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: bun install

      - name: Prepare production bastion SSH key
        run: |
          mkdir -p ~/.ssh "$(dirname "${PROD_SSH_KEY_PATH}")"
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > "${PROD_SSH_KEY_PATH}"
          chmod 600 "${PROD_SSH_KEY_PATH}"

          bastion_ip="$(getent ahostsv4 "${PROD_SSH_HOST}" | awk 'NR == 1 { print $1 }')"
          instance_id="$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${bastion_ip}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          test -n "${instance_id}" && test "${instance_id}" != "None"

          command_id="$(aws ssm send-command \
            --instance-ids "${instance_id}" \
            --document-name AWS-RunShellScript \
            --comment "Yawp production QA bastion host-key verification" \
            --parameters 'commands=["cat /etc/ssh/ssh_host_ed25519_key.pub"]' \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${instance_id}"
          host_key="$(aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${instance_id}" \
            --query 'StandardOutputContent' \
            --output text \
            | tr -d '\r' \
            | awk '$1 == "ssh-ed25519" { print $1 " " $2; exit }')"
          test -n "${host_key}"
          printf '%s %s\n' "${PROD_SSH_HOST}" "${host_key}" > ~/.ssh/known_hosts
          ssh-keygen -H -f ~/.ssh/known_hosts
          rm -f ~/.ssh/known_hosts.old
        env:
          PROD_SSH_KEY_PATH: ${{ runner.temp }}/yawp-production-bastion
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Generate Prisma client
        run: bun prisma:generate

      - name: Ensure production QA profile
        run: bun run --cwd packages/prisma production-qa-profile-remote production
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_QA_PASSWORD: ${{ secrets.PROD_QA_PASSWORD }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY_PATH: ${{ runner.temp }}/yawp-production-bastion

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify released-grade editing and activity in production
        run: bun run --cwd services/web-app production-qa-released-grade
        env:
          PROD_QA_BASE_URL: https://yawp.school
          PROD_QA_PASSWORD: ${{ secrets.PROD_QA_PASSWORD }}

      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-released-grade-activity
          path: services/web-app/test-results/production-released-grade-activity.png
          if-no-files-found: warn
