name: PR preview

on:
  # The workflow and host-side control plane always come from the reviewed base commit.
  # Pull-request code is synced separately and runs only inside the preview containers.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-deploy:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'preview:keep-awake') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[skip preview]') == false &&
      contains(github.event.pull_request.body, '[skip preview]') == false &&
      contains(github.event.pull_request.head.ref, '[skip preview]') == false
    runs-on: ubuntu-22.04
    environment: preview-host
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_TLS: ${{ vars.PREVIEW_TLS || 'true' }}
      PREVIEW_RUNTIME: ${{ vars.PREVIEW_RUNTIME || 'fast' }}
      PREVIEW_MAX_ENVS: ${{ vars.PREVIEW_MAX_ENVS || '30' }}
      PREVIEW_MAX_RESIDENT: ${{ vars.PREVIEW_MAX_RESIDENT || vars.PREVIEW_MAX_ENVS || '20' }}
      PREVIEW_MAX_RUNNING: ${{ vars.PREVIEW_MAX_RUNNING || '4' }}
      PREVIEW_SLEEP_ENABLED: ${{ vars.PREVIEW_SLEEP_ENABLED || 'true' }}
      PREVIEW_DRAFT_IDLE_HOURS: ${{ vars.PREVIEW_DRAFT_IDLE_HOURS || '48' }}
      PREVIEW_READY_IDLE_HOURS: ${{ vars.PREVIEW_READY_IDLE_HOURS || '48' }}
      PREVIEW_KEEP_AWAKE: ${{ contains(github.event.pull_request.labels.*.name, 'preview:keep-awake') }}
      PREVIEW_INFLIGHT_TTL_SECONDS: ${{ vars.PREVIEW_INFLIGHT_TTL_SECONDS || '3600' }}
      PREVIEW_DATA_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'sanitized-production-data') && 'sanitized-production' || vars.PREVIEW_DATA_MODE || 'seed' }}
      PREVIEW_SEAT_COUNT: ${{ vars.PREVIEW_SEAT_COUNT || '1' }}
      PREVIEW_AI_MODEL: ${{ vars.PREVIEW_AI_MODEL || 'claude-sonnet-4-6' }}
      PREVIEW_DB_DUMP_S3_URI: ${{ vars.PREVIEW_DB_DUMP_S3_URI || 's3://yawp-preview-videos/production.dump' }}
      PREVIEW_DB_DUMP_VERSION: ${{ contains(github.event.pull_request.labels.*.name, 'sanitized-production-data') && vars.PREVIEW_SANITIZED_DUMP_VERSION || vars.PREVIEW_DB_DUMP_VERSION || 'unversioned' }}
      PREVIEW_ACCESS_MASTER_ORGANIZATION_ID: ${{ contains(github.event.pull_request.labels.*.name, 'sanitized-production-data') && 'default-org' || 'local-dev-org' }}
      PREVIEW_POSTGRES_ADMIN_PASSWORD: ${{ secrets.PREVIEW_DB_PASSWORD }}
      PREVIEW_DEV_LOGIN_EMAIL: ${{ vars.PREVIEW_DEV_LOGIN_EMAIL || 'dev.teacher@yawp.local' }}
      PREVIEW_LOGIN_EMAIL: ${{ secrets.PREVIEW_LOGIN_EMAIL }}
      PREVIEW_LOGIN_PASSWORD: ${{ secrets.PREVIEW_LOGIN_PASSWORD }}
    steps:
      - name: Check preview environment configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_DOMAIN" || { echo "Missing repository variable PREVIEW_DOMAIN"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$PREVIEW_POSTGRES_ADMIN_PASSWORD" || { echo "Missing preview-host secret PREVIEW_DB_PASSWORD"; exit 1; }
          case "$PREVIEW_DATA_MODE" in
            seed) ;;
            production-dump)
              [[ -n "$PREVIEW_DB_DUMP_S3_URI" ]] || { echo "Missing repository variable PREVIEW_DB_DUMP_S3_URI"; exit 1; }
              [[ -n "$PREVIEW_LOGIN_EMAIL" ]] || { echo "Missing repository secret PREVIEW_LOGIN_EMAIL"; exit 1; }
              [[ -n "$PREVIEW_LOGIN_PASSWORD" ]] || { echo "Missing repository secret PREVIEW_LOGIN_PASSWORD"; exit 1; }
              ;;
            sanitized-production)
              [[ -n "$PREVIEW_DB_DUMP_S3_URI" ]] || { echo "Missing repository variable PREVIEW_DB_DUMP_S3_URI"; exit 1; }
              [[ -n "$PREVIEW_DB_DUMP_VERSION" && "$PREVIEW_DB_DUMP_VERSION" != "unversioned" ]] || { echo "Missing repository variable PREVIEW_SANITIZED_DUMP_VERSION"; exit 1; }
              ;;
            *)
              echo "PREVIEW_DATA_MODE must be seed, production-dump, or sanitized-production"
              exit 1
              ;;
          esac

      - name: Checkout reviewed preview control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: preview-control
          persist-credentials: false

      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          persist-credentials: false

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to preview host
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          remote_control="${PREVIEW_ROOT}/control/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          inflight_dir="${PREVIEW_ROOT}/inflight/pr-${PR_NUMBER}"
          inflight_marker="${inflight_dir}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          lock_file="${PREVIEW_ROOT}/preview-host.lock"
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          # Publish the marker before the source path. Capacity reconciliation ignores
          # fresh markers, so it cannot evict a tree while rsync or lock admission runs.
          printf -v setup_command 'mkdir -p %q && touch %q && mkdir -p %q %q' \
            "$inflight_dir" "$inflight_marker" "$remote_source" "$remote_control/scripts/preview"
          ssh -i ~/.ssh/preview_key "$ssh_target" \
            "flock -w 900 $(shell_quote "$lock_file") bash -lc $(shell_quote "$setup_command")"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/preview_key" \
            preview-control/scripts/preview/ "$ssh_target:$remote_control/scripts/preview/"
          (
            cd pr-source
            PREVIEW_SSH_KEY="$HOME/.ssh/preview_key" \
            PREVIEW_SSH_TARGET="$ssh_target" \
            PREVIEW_REMOTE_SOURCE="$remote_source" \
            PREVIEW_INFLIGHT_MARKER="$inflight_marker" \
            PREVIEW_INFLIGHT_TTL_SECONDS="$PREVIEW_INFLIGHT_TTL_SECONDS" \
              bash ../preview-control/scripts/preview/sync-source.sh
          )

      - name: Admit and deploy preview
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          # The host is a fixed-size box. Reclaim closed-PR environments, then evict the
          # least active, before adding one more. Without this the box fills until it
          # wedges and takes every preview down at once. The host fetches PR state only
          # after it holds the mutation lock, so a queued deploy cannot act on old data.
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          remote_control="${PREVIEW_ROOT}/control/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          inflight_marker="${PREVIEW_ROOT}/inflight/pr-${PR_NUMBER}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_env=(
            "PR_NUMBER=$(shell_quote "$PR_NUMBER")"
            "PREVIEW_DOMAIN=$(shell_quote "$PREVIEW_DOMAIN")"
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT")"
            "PREVIEW_MODE=admit"
            "PREVIEW_MAX_RESIDENT=$(shell_quote "$PREVIEW_MAX_RESIDENT")"
            "PREVIEW_MAX_RUNNING=$(shell_quote "$PREVIEW_MAX_RUNNING")"
            "PREVIEW_SLEEP_ENABLED=$(shell_quote "$PREVIEW_SLEEP_ENABLED")"
            "PREVIEW_DRAFT_IDLE_HOURS=$(shell_quote "$PREVIEW_DRAFT_IDLE_HOURS")"
            "PREVIEW_READY_IDLE_HOURS=$(shell_quote "$PREVIEW_READY_IDLE_HOURS")"
            "PREVIEW_KEEP_AWAKE=$(shell_quote "$PREVIEW_KEEP_AWAKE")"
            "PREVIEW_INFLIGHT_TTL_SECONDS=$(shell_quote "$PREVIEW_INFLIGHT_TTL_SECONDS")"
            "PREVIEW_INFLIGHT_MARKER=$(shell_quote "$inflight_marker")"
            "KEEP_PR=$(shell_quote "$PR_NUMBER")"
            "PREVIEW_GITHUB_REPOSITORY=$(shell_quote "$GITHUB_REPOSITORY")"
            "PREVIEW_GITHUB_API_URL=$(shell_quote "$GITHUB_API_URL")"
            "PREVIEW_GITHUB_TOKEN=$(shell_quote "$GH_TOKEN")"
            "PREVIEW_TLS=$(shell_quote "$PREVIEW_TLS")"
            "PREVIEW_RUNTIME=$(shell_quote "$PREVIEW_RUNTIME")"
            "PREVIEW_DATA_MODE=$(shell_quote "$PREVIEW_DATA_MODE")"
            "PREVIEW_SEAT_COUNT=$(shell_quote "$PREVIEW_SEAT_COUNT")"
            "PREVIEW_AI_MODEL=$(shell_quote "$PREVIEW_AI_MODEL")"
            "PREVIEW_DB_DUMP_S3_URI=$(shell_quote "$PREVIEW_DB_DUMP_S3_URI")"
            "PREVIEW_DB_DUMP_VERSION=$(shell_quote "$PREVIEW_DB_DUMP_VERSION")"
            "PREVIEW_ACCESS_MASTER_ORGANIZATION_ID=$(shell_quote "$PREVIEW_ACCESS_MASTER_ORGANIZATION_ID")"
            "PREVIEW_POSTGRES_ADMIN_PASSWORD=$(shell_quote "$PREVIEW_POSTGRES_ADMIN_PASSWORD")"
            "PREVIEW_DEV_LOGIN_EMAIL=$(shell_quote "$PREVIEW_DEV_LOGIN_EMAIL")"
            "PREVIEW_LOGIN_EMAIL=$(shell_quote "$PREVIEW_LOGIN_EMAIL")"
            "PREVIEW_LOGIN_PASSWORD=$(shell_quote "$PREVIEW_LOGIN_PASSWORD")"
            "SOURCE_DIR=$(shell_quote "$remote_source")"
            "PREVIEW_CONTROL_SHA=$(shell_quote "${{ github.event.pull_request.base.sha }}")"
          )
          set +e
          ssh -i ~/.ssh/preview_key "$ssh_target" \
            "cd $(shell_quote "$remote_control") && ${remote_env[*]} bash scripts/preview/admit-and-deploy.sh" \
            | tee /tmp/preview-deploy.log
          remote_status="${PIPESTATUS[0]}"
          set -e

          evicted="$(awk -F= '/^CAP_EVICTED=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          slept="$(awk -F= '/^CAP_SLEPT=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          result="$(awk -F= '/^CAP_RESULT=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          reason="$(awk -F= '/^CAP_REASON=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          resident="$(awk -F= '/^CAP_RESIDENT=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          running="$(awk -F= '/^CAP_RUNNING=/{print $2}' /tmp/preview-deploy.log | tail -1)"

          for pr in $slept; do
            gh pr comment "$pr" --body "Preview sleeping after 48 hours of inactivity. State and access code remain intact. Open its one-click URL, or revisit from an already authorized browser, to wake it automatically; the first request can take a minute." || true
          done
          for pr in $evicted; do
            gh pr comment "$pr" --body "Preview reclaimed at the ${PREVIEW_MAX_RESIDENT}-resident cap. Preview-local database and access state were deleted; push a commit or add \`preview:keep-awake\` to rebuild it." || true
          done

          if [[ "$result" == "full" ]]; then
            echo "::error::Preview host is full at ${reason}; pinned and incoming PRs could not be displaced."
            exit 1
          fi
          if [[ "$result" != "ok" ]]; then
            echo "::error::Preview host reconciliation failed at ${reason}."
            exit 1
          fi
          if [[ "$remote_status" -ne 0 ]]; then
            echo "::error::Remote preview admission/deploy failed with status ${remote_status}."
            exit "$remote_status"
          fi

          preview_url="$(awk -F= '/^PREVIEW_URL=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          access_code="$(awk -F= '/^PREVIEW_ACCESS_CODE=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          elapsed_ms="$(awk -F= '/^PREVIEW_ELAPSED_MS=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          test -n "$preview_url" || { echo "Deploy script did not print PREVIEW_URL"; exit 1; }
          test -n "$access_code" || { echo "Deploy script did not print PREVIEW_ACCESS_CODE"; exit 1; }
          echo "Preview capacity OK: ${running}/${PREVIEW_MAX_RUNNING} running before deploy, ${resident}/${PREVIEW_MAX_RESIDENT} resident."
          {
            echo "url=$preview_url"
            echo "access_code=$access_code"
            echo "elapsed_ms=${elapsed_ms:-unknown}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify preview access gate
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          access_code="${{ steps.deploy.outputs.access_code }}"
          health="$(curl -sk -o /dev/null -m 15 -w '%{http_code}' "$url/api/healthcheck")"
          test "$health" = "200" || { echo "Healthcheck returned HTTP $health"; exit 1; }

          gated_page="$(curl -skL -m 15 "$url")"
          grep -q 'data-preview-access-screen' <<<"$gated_page" || {
            echo "Request without a preview access cookie did not render the access screen" >&2
            exit 1
          }

          blocked="$(curl -sk -o /dev/null -m 15 -w '%{http_code}' \
            -X POST --data-urlencode 'email=dev.admin@yawp.local' \
            "$url/auth/dev-login")"
          test "$blocked" = "401" || {
            echo "POST /auth/dev-login without an access cookie returned HTTP $blocked, expected 401" >&2
            exit 1
          }

          cookie_jar="$(mktemp)"
          entered="$(curl -sk -o /dev/null -m 15 -w '%{http_code}' -c "$cookie_jar" \
            --data-urlencode "code=$access_code" "$url/auth/preview-access")"
          case "$entered" in
            302|303) ;;
            *) echo "Access code returned HTTP $entered" >&2; exit 1 ;;
          esac
          app="$(curl -skL -o /dev/null -m 15 -w '%{http_code}' -b "$cookie_jar" "$url")"
          test "$app" = "200" || { echo "Code-bearing request returned HTTP $app"; exit 1; }

          one_click_jar="$(mktemp)"
          one_click="$(curl -sk -o /dev/null -m 15 -w '%{http_code}' -c "$one_click_jar" \
            "$url/?code=$access_code")"
          test "$one_click" = "303" || {
            echo "One-click ?code= link returned HTTP $one_click, expected 303" >&2
            exit 1
          }
          one_click_app="$(curl -skL -o /dev/null -m 15 -w '%{http_code}' -b "$one_click_jar" "$url")"
          test "$one_click_app" = "200" || { echo "One-click cookie request returned HTTP $one_click_app"; exit 1; }
          echo "Access gate confirmed: health 200, no-cookie access screen, dev-login 401, code-bearing app 200, one-click ?code= 303"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview-${{ github.event.pull_request.number }}
          append: false
          message: |
            **PR preview**

            - **One-click:** ${{ steps.deploy.outputs.url }}/?code=${{ steps.deploy.outputs.access_code }}
            - **URL:** ${{ steps.deploy.outputs.url }}
            - **Access code:** `${{ steps.deploy.outputs.access_code }}`
            - **Runtime:** Docker Compose on the preview environment host
            - **Data:** `${{ env.PREVIEW_DATA_MODE }}` in an isolated PR database
            - **Deploy elapsed:** `${{ steps.deploy.outputs.elapsed_ms }}ms`
            - **Smoke:** in-app access gate + dev login

      - name: Remove run-scoped control copy
        if: always()
        run: |
          set -euo pipefail
          [[ -f "$HOME/.ssh/preview_key" && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 0
          remote_control="${PREVIEW_ROOT}/control/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v cleanup_command 'rm -rf -- %q' "$remote_control"
          ssh -i "$HOME/.ssh/preview_key" "${PREVIEW_SSH_USER}@${PREVIEW_HOST}" "$cleanup_command" || true

  preview-destroy:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    environment: preview-host
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
    steps:
      - name: Check preview environment configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Checkout current cleanup implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Destroy preview
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_env=(
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT")"
            "PREVIEW_TTL_HOURS=0"
            "OPEN_PR_NUMBERS=''"
            "TARGET_PR=$(shell_quote "$PR_NUMBER")"
          )
          lock_file="$(shell_quote "$PREVIEW_ROOT/preview-host.lock")"
          cat scripts/preview/remove-preview-path.sh scripts/preview/cleanup.sh \
            | ssh -i ~/.ssh/preview_key "$ssh_target" \
              "flock -w 900 $lock_file env ${remote_env[*]} bash -s"

  preview-cleanup:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-22.04
    environment: preview-host
    env:
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_MAX_RESIDENT: ${{ vars.PREVIEW_MAX_RESIDENT || vars.PREVIEW_MAX_ENVS || '20' }}
      PREVIEW_MAX_RUNNING: ${{ vars.PREVIEW_MAX_RUNNING || '4' }}
      PREVIEW_SLEEP_ENABLED: ${{ vars.PREVIEW_SLEEP_ENABLED || 'true' }}
      PREVIEW_DRAFT_IDLE_HOURS: ${{ vars.PREVIEW_DRAFT_IDLE_HOURS || '48' }}
      PREVIEW_READY_IDLE_HOURS: ${{ vars.PREVIEW_READY_IDLE_HOURS || '48' }}
      PREVIEW_INFLIGHT_TTL_SECONDS: ${{ vars.PREVIEW_INFLIGHT_TTL_SECONDS || '3600' }}
    steps:
      - name: Check preview cleanup configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Reconcile preview capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_env=(
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT")"
            "PREVIEW_MODE=reconcile"
            "PREVIEW_MAX_RESIDENT=$(shell_quote "$PREVIEW_MAX_RESIDENT")"
            "PREVIEW_MAX_RUNNING=$(shell_quote "$PREVIEW_MAX_RUNNING")"
            "PREVIEW_SLEEP_ENABLED=$(shell_quote "$PREVIEW_SLEEP_ENABLED")"
            "PREVIEW_DRAFT_IDLE_HOURS=$(shell_quote "$PREVIEW_DRAFT_IDLE_HOURS")"
            "PREVIEW_READY_IDLE_HOURS=$(shell_quote "$PREVIEW_READY_IDLE_HOURS")"
            "PREVIEW_INFLIGHT_TTL_SECONDS=$(shell_quote "$PREVIEW_INFLIGHT_TTL_SECONDS")"
            "PREVIEW_GITHUB_REPOSITORY=$(shell_quote "$GITHUB_REPOSITORY")"
            "PREVIEW_GITHUB_API_URL=$(shell_quote "$GITHUB_API_URL")"
            "PREVIEW_GITHUB_TOKEN=$(shell_quote "$GH_TOKEN")"
          )
          cat scripts/preview/remove-preview-path.sh scripts/preview/enforce-cap.sh \
            | ssh -i ~/.ssh/preview_key "$ssh_target" "${remote_env[*]} bash -s" \
            | tee /tmp/reconcile.log

          slept="$(awk -F= '/^CAP_SLEPT=/{print $2}' /tmp/reconcile.log | tail -1)"
          evicted="$(awk -F= '/^CAP_EVICTED=/{print $2}' /tmp/reconcile.log | tail -1)"
          result="$(awk -F= '/^CAP_RESULT=/{print $2}' /tmp/reconcile.log | tail -1)"
          reason="$(awk -F= '/^CAP_REASON=/{print $2}' /tmp/reconcile.log | tail -1)"
          running="$(awk -F= '/^CAP_RUNNING=/{print $2}' /tmp/reconcile.log | tail -1)"
          resident="$(awk -F= '/^CAP_RESIDENT=/{print $2}' /tmp/reconcile.log | tail -1)"

          for pr in $slept; do
            gh pr comment "$pr" --body "Preview sleeping after 48 hours of inactivity. State and access code remain intact. Open its one-click URL, or revisit from an already authorized browser, to wake it automatically; the first request can take a minute." || true
          done
          for pr in $evicted; do
            gh pr comment "$pr" --body "Preview reclaimed at the ${PREVIEW_MAX_RESIDENT}-resident cap. Preview-local database and access state were deleted; push a commit or add \`preview:keep-awake\` to rebuild it." || true
          done
          if [ "$result" = "full" ]; then
            echo "::error::Preview reconciliation remains full at ${reason}."
            exit 1
          fi
          if [ "$result" != "ok" ]; then
            echo "::error::Preview reconciliation failed at ${reason}."
            exit 1
          fi
          echo "Preview reconcile OK: ${running}/${PREVIEW_MAX_RUNNING} running, ${resident}/${PREVIEW_MAX_RESIDENT} resident."
