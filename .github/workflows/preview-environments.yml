name: PR preview (App Runner)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to deploy or destroy
        required: true
        type: number
      preview_action:
        description: Preview action
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  preview-deploy:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.title, '[skip preview]') == false &&
        contains(github.event.pull_request.body, '[skip preview]') == false &&
        contains(github.event.pull_request.head.ref, '[skip preview]') == false
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/preview') &&
        contains(github.event.comment.body, 'destroy') == false &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.preview_action == 'deploy'
      )
    runs-on: ubuntu-22.04
    env:
      PREVIEW_TF_STATE_BUCKET: ${{ vars.PREVIEW_TF_STATE_BUCKET }}
      PREVIEW_ECR_REPOSITORY: ${{ vars.PREVIEW_ECR_REPOSITORY }}
      PREVIEW_DB_URL_SECRET_ARN: ${{ vars.PREVIEW_DB_URL_SECRET_ARN }}
      PREVIEW_SESSION_SECRET_ARN: ${{ vars.PREVIEW_SESSION_SECRET_ARN }}
      PREVIEW_HONEYPOT_SECRET_ARN: ${{ vars.PREVIEW_HONEYPOT_SECRET_ARN }}
      PREVIEW_OPENAI_ORG_SECRET_ARN: ${{ vars.PREVIEW_OPENAI_ORG_SECRET_ARN }}
      PREVIEW_OPENAI_KEY_SECRET_ARN: ${{ vars.PREVIEW_OPENAI_KEY_SECRET_ARN }}
      PREVIEW_ANTHROPIC_KEY_SECRET_ARN: ${{ vars.PREVIEW_ANTHROPIC_KEY_SECRET_ARN }}
      PREVIEW_INTERNAL_TOKEN_SECRET_ARN: ${{ vars.PREVIEW_INTERNAL_TOKEN_SECRET_ARN }}
      PREVIEW_RESEND_SECRET_ARN: ${{ vars.PREVIEW_RESEND_SECRET_ARN }}
      PREVIEW_SENTRY_DSN_SECRET_ARN: ${{ vars.PREVIEW_SENTRY_DSN_SECRET_ARN }}
      PREVIEW_AWS_S3_BUCKET: ${{ vars.PREVIEW_AWS_S3_BUCKET }}
      PREVIEW_DB_DUMP_S3_URI: ${{ vars.PREVIEW_DB_DUMP_S3_URI }}
      PREVIEW_RESEND_FROM_EMAIL: ${{ vars.PREVIEW_RESEND_FROM_EMAIL }}
    steps:
      - name: Resolve PR preview target
        id: preview-target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          REQUESTED_ACTION: deploy
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR_NUMBER}")"
          PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
          PR_STATE="$(jq -r '.state' <<<"$PR_JSON")"
          PR_TITLE="$(jq -r '.title // ""' <<<"$PR_JSON")"
          PR_BODY="$(jq -r '.body // ""' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"

          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "Preview deploys only run for same-repository branches because they require repository secrets."
            echo "PR #${PR_NUMBER} head repository is ${HEAD_REPO}; expected ${GITHUB_REPOSITORY}."
            exit 1
          fi
          if [[ "$PR_STATE" != "open" ]]; then
            echo "Preview deploys require an open PR. PR #${PR_NUMBER} is ${PR_STATE}."
            exit 1
          fi
          if [[ "$PR_TITLE" == *"[skip preview]"* || "$PR_BODY" == *"[skip preview]"* || "$HEAD_REF" == *"[skip preview]"* ]]; then
            echo "PR #${PR_NUMBER} is marked [skip preview]. Remove that marker before deploying a preview."
            exit 1
          fi

          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "PR_HEAD_REF=${HEAD_REF}" >> "$GITHUB_ENV"
          echo "PR_HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Normalize configuration
        run: |
          echo "AWS_REGION=${PREVIEW_AWS_REGION:-us-east-1}" >> "$GITHUB_ENV"
          echo "PREVIEW_APP_NAME=${PREVIEW_APP_NAME_INPUT:-yawp-preview}" >> "$GITHUB_ENV"
        env:
          PREVIEW_AWS_REGION: ${{ vars.PREVIEW_AWS_REGION }}
          PREVIEW_APP_NAME_INPUT: ${{ vars.PREVIEW_APP_NAME }}

      - name: Check preview configuration
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}" || { echo "Missing secret AWS_ROLE_ARN (OIDC role for preview deploy)"; exit 1; }
          test -n "$PREVIEW_TF_STATE_BUCKET" || { echo "Missing var PREVIEW_TF_STATE_BUCKET"; exit 1; }
          test -n "$PREVIEW_ECR_REPOSITORY" || { echo "Missing var PREVIEW_ECR_REPOSITORY"; exit 1; }
          test -n "$PREVIEW_DB_URL_SECRET_ARN" || { echo "Missing var PREVIEW_DB_URL_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_SESSION_SECRET_ARN" || { echo "Missing var PREVIEW_SESSION_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_HONEYPOT_SECRET_ARN" || { echo "Missing var PREVIEW_HONEYPOT_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_OPENAI_ORG_SECRET_ARN" || { echo "Missing var PREVIEW_OPENAI_ORG_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_OPENAI_KEY_SECRET_ARN" || { echo "Missing var PREVIEW_OPENAI_KEY_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_ANTHROPIC_KEY_SECRET_ARN" || { echo "Missing var PREVIEW_ANTHROPIC_KEY_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_INTERNAL_TOKEN_SECRET_ARN" || { echo "Missing var PREVIEW_INTERNAL_TOKEN_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_RESEND_SECRET_ARN" || { echo "Missing var PREVIEW_RESEND_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_SENTRY_DSN_SECRET_ARN" || { echo "Missing var PREVIEW_SENTRY_DSN_SECRET_ARN"; exit 1; }
          test -n "$PREVIEW_AWS_S3_BUCKET" || { echo "Missing var PREVIEW_AWS_S3_BUCKET (use staging bucket name, not production)"; exit 1; }
          test -n "$PREVIEW_RESEND_FROM_EMAIL" || { echo "Missing var PREVIEW_RESEND_FROM_EMAIL"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preview-target.outputs.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Install dependencies
        run: bun install

      - name: Load base database URL from Secrets Manager
        run: |
          BASE_DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "$PREVIEW_DB_URL_SECRET_ARN" \
            --query SecretString --output text)
          if [[ "$BASE_DATABASE_URL" != *sslmode=* ]]; then
            if [[ "$BASE_DATABASE_URL" == *\?* ]]; then
              BASE_DATABASE_URL="${BASE_DATABASE_URL}&sslmode=require"
            else
              BASE_DATABASE_URL="${BASE_DATABASE_URL}?sslmode=require"
            fi
          fi
          echo "::add-mask::$BASE_DATABASE_URL"
          echo "BASE_DATABASE_URL=$BASE_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Create PR schema, restore dump, and migrate
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          set -euo pipefail
          SCHEMA="pr_${PR_NUMBER}"
          export DATABASE_URL="$BASE_DATABASE_URL"

          # Create schema
          echo "CREATE SCHEMA IF NOT EXISTS ${SCHEMA};" | (cd packages/prisma && bunx prisma db execute --stdin)

          # Build schema-qualified URL
          if [[ "$BASE_DATABASE_URL" == *\?* ]]; then
            MIGRATE_URL="${BASE_DATABASE_URL}&schema=${SCHEMA}"
          else
            MIGRATE_URL="${BASE_DATABASE_URL}?schema=${SCHEMA}"
          fi
          echo "::add-mask::$MIGRATE_URL"

          # psql/libpq rejects Prisma's ?schema= — use URL without it (sed output is schema-qualified)
          PSQL_URL="$(node -e "const u=new URL(process.env.BASE_DATABASE_URL); u.searchParams.delete('schema'); process.stdout.write(u.toString())")"
          echo "::add-mask::$PSQL_URL"

          # If a migration file was edited after this preview schema already
          # recorded it, Prisma will not replay it. Preview data is disposable,
          # so rebuild the schema when stored checksums no longer match the
          # checked-out migration files.
          MIGRATION_CHECKSUM_DRIFT="0"
          while IFS= read -r migration_file; do
            migration_name="$(basename "$(dirname "$migration_file")")"
            expected_checksum="$(shasum -a 256 "$migration_file" | awk '{print $1}')"
            applied_checksum="$(psql "$PSQL_URL" -tAc "SELECT checksum FROM ${SCHEMA}._prisma_migrations WHERE migration_name = '${migration_name}' AND finished_at IS NOT NULL ORDER BY finished_at DESC LIMIT 1" 2>/dev/null || true)"
            applied_checksum="${applied_checksum// /}"
            if [[ -n "$applied_checksum" && "$applied_checksum" != "$expected_checksum" ]]; then
              echo "Schema ${SCHEMA} has migration checksum drift for ${migration_name}; forcing restore."
              MIGRATION_CHECKSUM_DRIFT="1"
              break
            fi
          done < <(find packages/prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | sort)

          # Use pg_stat_user_tables.n_live_tup as a fast row-count proxy: a
          # healthy production restore has thousands of live tuples, an empty
          # or partially-restored schema has 0. This makes the workflow
          # self-healing — a previously aborted restore (which can leave empty
          # tables behind) won't trick us into skipping the restore.
          EXISTING_LIVE_TUPLES="$(psql "$PSQL_URL" -tAc "SELECT COALESCE(SUM(n_live_tup), 0)::text FROM pg_stat_user_tables WHERE schemaname = '${SCHEMA}'" || echo 0)"
          EXISTING_LIVE_TUPLES="${EXISTING_LIVE_TUPLES// /}"
          if [[ "$MIGRATION_CHECKSUM_DRIFT" != "1" && "${EXISTING_LIVE_TUPLES:-0}" -gt 100 ]]; then
            echo "Schema ${SCHEMA} is populated (${EXISTING_LIVE_TUPLES} live tuples); skipping dump restore to preserve data."
          else
            echo "Schema ${SCHEMA} is empty or stale (${EXISTING_LIVE_TUPLES:-0} live tuples); dropping and re-restoring..."
            echo "DROP SCHEMA IF EXISTS ${SCHEMA} CASCADE; CREATE SCHEMA ${SCHEMA};" | (cd packages/prisma && bunx prisma db execute --stdin)

            DUMP_URI="${PREVIEW_DB_DUMP_S3_URI:-s3://${PREVIEW_AWS_S3_BUCKET}/production.dump}"
            echo "Restoring production dump into schema ${SCHEMA} from ${DUMP_URI}..."
            # Strip ownership/ACL clauses — preview DB has no `yawp_admin` role,
            # so OWNER TO / GRANT / REVOKE statements would fail and abort psql.
            aws s3 cp "$DUMP_URI" - \
              | sed -e "s/public\./${SCHEMA}./g" \
                    -e "s/search_path = public/search_path = ${SCHEMA}/g" \
                    -e "/OWNER TO /d" \
                    -e "/^GRANT /d" \
                    -e "/^REVOKE /d" \
              | psql "$PSQL_URL"
          fi

          # Apply any newer migrations
          HAS_ASSIGNMENTS_PRE_SCHEMA="$(psql "$PSQL_URL" -tAc "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = '${SCHEMA}' AND table_name = 'StudentCourse')" || echo f)"
          HAS_ASSIGNMENTS_PRE_SCHEMA="${HAS_ASSIGNMENTS_PRE_SCHEMA// /}"
          if [[ "$HAS_ASSIGNMENTS_PRE_SCHEMA" == "t" ]]; then
            echo "Capturing assignments-unification preflight state for ${SCHEMA}..."
            (cd packages/prisma && PGOPTIONS="-c search_path=${SCHEMA}" DATABASE_URL="$MIGRATE_URL" PREFLIGHT_STATE_PATH=/tmp/assignments-unification-preflight.json bun ./scripts/assignments-unification-preflight.ts)
          fi

          (cd packages/prisma && DATABASE_URL="$MIGRATE_URL" bunx prisma migrate deploy)

          if [[ "$HAS_ASSIGNMENTS_PRE_SCHEMA" == "t" ]]; then
            echo "Verifying assignments-unification migration before seed overlay..."
            (cd packages/prisma && PGOPTIONS="-c search_path=${SCHEMA}" DATABASE_URL="$MIGRATE_URL" PREFLIGHT_STATE_PATH=/tmp/assignments-unification-preflight.json bun ./scripts/assignments-unification-postcheck.ts)
            (cd packages/prisma && PGOPTIONS="-c search_path=${SCHEMA}" DATABASE_URL="$MIGRATE_URL" PREFLIGHT_STATE_PATH=/tmp/assignments-unification-preflight.json bun test ./scripts/assignments-unification-contracts.test.ts)
          fi

          bun run prisma:generate

          # Overlay test users (for smoke tests)
          DATABASE_SSL_REJECT_UNAUTHORIZED=false DATABASE_URL="$MIGRATE_URL" bun run packages/prisma/scripts/seed-overlay.ts

      - name: Build and push image to ECR
        run: |
          set -euo pipefail
          REGISTRY="${PREVIEW_ECR_REPOSITORY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -f services/web-app/Dockerfile \
            --build-arg DATABASE_URL=postgresql://postgres:postgres@localhost:5432/preview_build \
            -t "${PREVIEW_ECR_REPOSITORY}:pr-${PR_NUMBER}" .
          docker push "${PREVIEW_ECR_REPOSITORY}:pr-${PR_NUMBER}"

      - name: Terraform apply (infra-pr)
        id: tf
        env:
          TF_VAR_posthog_api_key: ${{ vars.PREVIEW_POSTHOG_API_KEY }}
          TF_VAR_posthog_host: ${{ vars.PREVIEW_POSTHOG_HOST }}
          TF_VAR_ai_model: ${{ vars.PREVIEW_AI_MODEL }}
        run: |
          set -euo pipefail
          export TF_VAR_app_name="$PREVIEW_APP_NAME"
          export TF_VAR_env="pr-${PR_NUMBER}"
          export TF_VAR_database_schema="pr_${PR_NUMBER}"
          export TF_VAR_web_app_image_identifier="${PREVIEW_ECR_REPOSITORY}:pr-${PR_NUMBER}"
          export TF_VAR_shared_database_url_secret_arn="$PREVIEW_DB_URL_SECRET_ARN"
          export TF_VAR_shared_session_secret_arn="$PREVIEW_SESSION_SECRET_ARN"
          export TF_VAR_shared_honeypot_secret_arn="$PREVIEW_HONEYPOT_SECRET_ARN"
          export TF_VAR_shared_openai_org_secret_arn="$PREVIEW_OPENAI_ORG_SECRET_ARN"
          export TF_VAR_shared_openai_key_secret_arn="$PREVIEW_OPENAI_KEY_SECRET_ARN"
          export TF_VAR_shared_anthropic_key_secret_arn="$PREVIEW_ANTHROPIC_KEY_SECRET_ARN"
          export TF_VAR_shared_internal_token_secret_arn="$PREVIEW_INTERNAL_TOKEN_SECRET_ARN"
          export TF_VAR_shared_resend_api_key_secret_arn="$PREVIEW_RESEND_SECRET_ARN"
          export TF_VAR_shared_sentry_dsn_secret_arn="$PREVIEW_SENTRY_DSN_SECRET_ARN"
          export TF_VAR_aws_s3_bucket_for_videos="$PREVIEW_AWS_S3_BUCKET"
          export TF_VAR_resend_from_email="$PREVIEW_RESEND_FROM_EMAIL"
          terraform -chdir=infra-pr init \
            -backend-config="bucket=${PREVIEW_TF_STATE_BUCKET}" \
            -backend-config="key=yawp/pr/pr-${PR_NUMBER}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
          # Import IAM roles if they already exist (leftover from prior deploys)
          for role_resource in aws_iam_role.apprunner_access aws_iam_role.apprunner_instance; do
            role_name="${TF_VAR_app_name}-${TF_VAR_env}-${role_resource##*.}"
            role_name="${role_name//_/-}"
            if aws iam get-role --role-name "$role_name" >/dev/null 2>&1; then
              echo "Importing existing IAM role: $role_name"
              terraform -chdir=infra-pr import "$role_resource" "$role_name" 2>/dev/null || true
            fi
          done
          # Import App Runner service if it already exists but is missing from state
          SVC_NAME="${TF_VAR_app_name}-${TF_VAR_env}"
          EXISTING_SVC_ARN=$(aws apprunner list-services --region "${AWS_REGION}" \
            --query "ServiceSummaryList[?ServiceName=='${SVC_NAME}'].ServiceArn | [0]" \
            --output text 2>/dev/null || true)
          if [[ -n "$EXISTING_SVC_ARN" && "$EXISTING_SVC_ARN" != "None" ]]; then
            echo "Importing existing App Runner service: $SVC_NAME ($EXISTING_SVC_ARN)"
            terraform -chdir=infra-pr import aws_apprunner_service.web "$EXISTING_SVC_ARN" 2>/dev/null || true
          fi
          for attempt in $(seq 1 8); do
            set +e
            terraform -chdir=infra-pr apply -auto-approve 2>&1 | tee /tmp/tf-apply.log
            tf_rc=$?
            set -e
            if [[ "$tf_rc" -eq 0 ]]; then break; fi
            if grep -q 'EntityAlreadyExists' /tmp/tf-apply.log; then
              echo "IAM entity exists; attempting import and retry ($attempt/8)..."
              # Extract role names from error and import
              grep -oP 'Role with name \K[^ ]+' /tmp/tf-apply.log | while read -r rname; do
                if echo "$rname" | grep -q "access"; then
                  terraform -chdir=infra-pr import aws_iam_role.apprunner_access "$rname" 2>/dev/null || true
                elif echo "$rname" | grep -q "instance"; then
                  terraform -chdir=infra-pr import aws_iam_role.apprunner_instance "$rname" 2>/dev/null || true
                fi
              done
              continue
            fi
            if grep -q 'already exists' /tmp/tf-apply.log || grep -q 'InvalidRequestException' /tmp/tf-apply.log; then
              echo "App Runner service already exists; attempting import and retry ($attempt/8)..."
              SVC_ARN=$(aws apprunner list-services --region "${AWS_REGION}" \
                --query "ServiceSummaryList[?ServiceName=='${SVC_NAME}'].ServiceArn | [0]" \
                --output text 2>/dev/null || true)
              if [[ -n "$SVC_ARN" && "$SVC_ARN" != "None" ]]; then
                terraform -chdir=infra-pr import aws_apprunner_service.web "$SVC_ARN" 2>/dev/null || true
              fi
              continue
            fi
            if ! grep -q 'OPERATION_IN_PROGRESS' /tmp/tf-apply.log; then exit "$tf_rc"; fi
            if [[ "$attempt" -eq 8 ]]; then exit "$tf_rc"; fi
            echo "App Runner busy; sleeping 45s before terraform retry ($attempt/8)..."
            sleep 45
          done
          URL=$(terraform -chdir=infra-pr output -raw apprunner_service_url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Start App Runner deployment
        run: |
          set -euo pipefail
          SVC_ARN=$(terraform -chdir=infra-pr output -raw apprunner_service_arn)
          aws apprunner start-deployment --service-arn "$SVC_ARN" --region "${AWS_REGION}"

      - name: Wait for preview URL
        run: |
          set -euo pipefail
          SVC_ARN=$(terraform -chdir=infra-pr output -raw apprunner_service_arn)
          echo "Waiting for App Runner status RUNNING (not OPERATION_IN_PROGRESS) after deployment..."
          STATUS=""
          for i in $(seq 1 90); do
            STATUS=$(aws apprunner describe-service --service-arn "$SVC_ARN" --region "${AWS_REGION}" --query 'Service.Status' --output text)
            if [[ "$STATUS" == "RUNNING" ]]; then
              echo "App Runner status RUNNING after attempt $i."
              break
            fi
            echo "Attempt $i/90 — App Runner status: $STATUS"
            sleep 10
          done
          if [[ "${STATUS:-}" != "RUNNING" ]]; then
            echo "App Runner did not reach RUNNING in time (last status: ${STATUS:-unknown})."
            exit 1
          fi
          RAW="${{ steps.tf.outputs.url }}"
          if [[ "$RAW" != http* ]]; then PREVIEW_BASE_URL="https://${RAW}"; else PREVIEW_BASE_URL="$RAW"; fi
          echo "PREVIEW_BASE_URL=$PREVIEW_BASE_URL" >> "$GITHUB_ENV"
          echo "Waiting for $PREVIEW_BASE_URL/api/healthcheck ..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null --max-time 25 "$PREVIEW_BASE_URL/api/healthcheck"; then
              echo "Preview responded after attempt $i."
              exit 0
            fi
            echo "Attempt $i/60 — App Runner may still be warming up..."
            sleep 10
          done
          echo "Preview URL did not return HTTP 200 in time."
          exit 1

      - name: Install Playwright (Chromium)
        run: cd services/web-app && bunx playwright install --with-deps chromium

      - name: PR preview smoke tests
        run: cd services/web-app && bun run scripts/smoke-pr-preview.mjs

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.tf.outputs.url }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = `<!-- Sticky Pull Request Commentpr-preview-${prNumber} -->`;
            const body = [
              '**PR preview** (App Runner)',
              '',
              `- **URL:** ${process.env.PREVIEW_URL}`,
              `- **Postgres schema:** \`pr_${prNumber}\``,
              `- **Image:** \`${process.env.PREVIEW_ECR_REPOSITORY}:pr-${prNumber}\``,
              '- **Data:** Production dump + test overlay (e.g. `teacher@fake.test` / `teacher123`)',
              '- **Smoke:** `services/web-app/scripts/smoke-pr-preview.mjs`',
              marker,
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

  preview-destroy:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.title, '[skip preview]') == false &&
        contains(github.event.pull_request.body, '[skip preview]') == false &&
        contains(github.event.pull_request.head.ref, '[skip preview]') == false
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/preview destroy') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.preview_action == 'destroy'
      )
    runs-on: ubuntu-22.04
    env:
      PREVIEW_TF_STATE_BUCKET: ${{ vars.PREVIEW_TF_STATE_BUCKET }}
      PREVIEW_ECR_REPOSITORY: ${{ vars.PREVIEW_ECR_REPOSITORY }}
      PREVIEW_DB_URL_SECRET_ARN: ${{ vars.PREVIEW_DB_URL_SECRET_ARN }}
      PREVIEW_SESSION_SECRET_ARN: ${{ vars.PREVIEW_SESSION_SECRET_ARN }}
      PREVIEW_HONEYPOT_SECRET_ARN: ${{ vars.PREVIEW_HONEYPOT_SECRET_ARN }}
      PREVIEW_OPENAI_ORG_SECRET_ARN: ${{ vars.PREVIEW_OPENAI_ORG_SECRET_ARN }}
      PREVIEW_OPENAI_KEY_SECRET_ARN: ${{ vars.PREVIEW_OPENAI_KEY_SECRET_ARN }}
      PREVIEW_ANTHROPIC_KEY_SECRET_ARN: ${{ vars.PREVIEW_ANTHROPIC_KEY_SECRET_ARN }}
      PREVIEW_INTERNAL_TOKEN_SECRET_ARN: ${{ vars.PREVIEW_INTERNAL_TOKEN_SECRET_ARN }}
      PREVIEW_RESEND_SECRET_ARN: ${{ vars.PREVIEW_RESEND_SECRET_ARN }}
      PREVIEW_SENTRY_DSN_SECRET_ARN: ${{ vars.PREVIEW_SENTRY_DSN_SECRET_ARN }}
      PREVIEW_AWS_S3_BUCKET: ${{ vars.PREVIEW_AWS_S3_BUCKET }}
      PREVIEW_RESEND_FROM_EMAIL: ${{ vars.PREVIEW_RESEND_FROM_EMAIL }}
    steps:
      - name: Resolve PR preview target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR_NUMBER}")"
          PR_NUMBER="$(jq -r '.number' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"

          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "Preview destroys only run for same-repository branches because they require repository secrets."
            echo "PR #${PR_NUMBER} head repository is ${HEAD_REPO}; expected ${GITHUB_REPOSITORY}."
            exit 1
          fi

          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"

      - name: Normalize configuration
        run: |
          echo "AWS_REGION=${PREVIEW_AWS_REGION:-us-east-1}" >> "$GITHUB_ENV"
          echo "PREVIEW_APP_NAME=${PREVIEW_APP_NAME_INPUT:-yawp-preview}" >> "$GITHUB_ENV"
        env:
          PREVIEW_AWS_REGION: ${{ vars.PREVIEW_AWS_REGION }}
          PREVIEW_APP_NAME_INPUT: ${{ vars.PREVIEW_APP_NAME }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Terraform destroy (infra-pr)
        env:
          TF_VAR_posthog_api_key: ${{ vars.PREVIEW_POSTHOG_API_KEY }}
          TF_VAR_posthog_host: ${{ vars.PREVIEW_POSTHOG_HOST }}
          TF_VAR_ai_model: ${{ vars.PREVIEW_AI_MODEL }}
        run: |
          set -euo pipefail
          export TF_VAR_app_name="$PREVIEW_APP_NAME"
          export TF_VAR_env="pr-${PR_NUMBER}"
          export TF_VAR_database_schema="pr_${PR_NUMBER}"
          export TF_VAR_web_app_image_identifier="${PREVIEW_ECR_REPOSITORY}:pr-${PR_NUMBER}"
          export TF_VAR_shared_database_url_secret_arn="$PREVIEW_DB_URL_SECRET_ARN"
          export TF_VAR_shared_session_secret_arn="$PREVIEW_SESSION_SECRET_ARN"
          export TF_VAR_shared_honeypot_secret_arn="$PREVIEW_HONEYPOT_SECRET_ARN"
          export TF_VAR_shared_openai_org_secret_arn="$PREVIEW_OPENAI_ORG_SECRET_ARN"
          export TF_VAR_shared_openai_key_secret_arn="$PREVIEW_OPENAI_KEY_SECRET_ARN"
          export TF_VAR_shared_anthropic_key_secret_arn="$PREVIEW_ANTHROPIC_KEY_SECRET_ARN"
          export TF_VAR_shared_internal_token_secret_arn="$PREVIEW_INTERNAL_TOKEN_SECRET_ARN"
          export TF_VAR_shared_resend_api_key_secret_arn="$PREVIEW_RESEND_SECRET_ARN"
          export TF_VAR_shared_sentry_dsn_secret_arn="$PREVIEW_SENTRY_DSN_SECRET_ARN"
          export TF_VAR_aws_s3_bucket_for_videos="$PREVIEW_AWS_S3_BUCKET"
          export TF_VAR_resend_from_email="$PREVIEW_RESEND_FROM_EMAIL"
          terraform -chdir=infra-pr init \
            -backend-config="bucket=${PREVIEW_TF_STATE_BUCKET}" \
            -backend-config="key=yawp/pr/pr-${PR_NUMBER}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
          terraform -chdir=infra-pr destroy -auto-approve

      - name: Comment preview destroy on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = `<!-- Sticky Pull Request Commentpr-preview-${prNumber} -->`;
            const body = [
              '**PR preview** (App Runner)',
              '',
              `Preview infrastructure for \`pr_${prNumber}\` has been destroyed.`,
              marker,
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
