name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-deploy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[skip preview]') == false &&
      contains(github.event.pull_request.body, '[skip preview]') == false &&
      contains(github.event.pull_request.head.ref, '[skip preview]') == false
    runs-on: ubuntu-22.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_TLS: ${{ vars.PREVIEW_TLS || 'true' }}
      PREVIEW_RUNTIME: ${{ vars.PREVIEW_RUNTIME || 'fast' }}
      PREVIEW_MAX_ENVS: ${{ vars.PREVIEW_MAX_ENVS || '30' }}
      PREVIEW_DATA_MODE: ${{ vars.PREVIEW_DATA_MODE || 'seed' }}
      PREVIEW_SEAT_COUNT: ${{ vars.PREVIEW_SEAT_COUNT || '1' }}
      PREVIEW_AI_MODEL: ${{ vars.PREVIEW_AI_MODEL || 'claude-sonnet-4-6' }}
      PREVIEW_ANTHROPIC_API_KEY: ${{ secrets.PREVIEW_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
      PREVIEW_DB_DUMP_S3_URI: ${{ vars.PREVIEW_DB_DUMP_S3_URI || 's3://yawp-preview-videos/production.dump' }}
      PREVIEW_DB_PASSWORD: ${{ secrets.PREVIEW_DB_PASSWORD }}
      PREVIEW_DEV_LOGIN_EMAIL: ${{ vars.PREVIEW_DEV_LOGIN_EMAIL || 'dev.teacher@yawp.local' }}
      PREVIEW_LOGIN_EMAIL: ${{ secrets.PREVIEW_LOGIN_EMAIL }}
      PREVIEW_LOGIN_PASSWORD: ${{ secrets.PREVIEW_LOGIN_PASSWORD }}
    steps:
      - name: Check preview environment configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_DOMAIN" || { echo "Missing repository variable PREVIEW_DOMAIN"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$PREVIEW_ANTHROPIC_API_KEY" || { echo "Missing repository secret PREVIEW_ANTHROPIC_API_KEY or ANTHROPIC_API_KEY"; exit 1; }
          case "$PREVIEW_DATA_MODE" in
            seed) ;;
            production-dump)
              [[ -n "$PREVIEW_DB_DUMP_S3_URI" ]] || { echo "Missing repository variable PREVIEW_DB_DUMP_S3_URI"; exit 1; }
              [[ -n "$PREVIEW_LOGIN_EMAIL" ]] || { echo "Missing repository secret PREVIEW_LOGIN_EMAIL"; exit 1; }
              [[ -n "$PREVIEW_LOGIN_PASSWORD" ]] || { echo "Missing repository secret PREVIEW_LOGIN_PASSWORD"; exit 1; }
              ;;
            *)
              echo "PREVIEW_DATA_MODE must be seed or production-dump"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to preview host
        run: |
          set -euo pipefail
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          ssh -i ~/.ssh/preview_key "$ssh_target" "mkdir -p '$remote_source'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'services/web-app/node_modules' \
            --exclude 'services/web-app/.react-router' \
            --exclude 'services/web-app/.vite' \
            --exclude 'packages/prisma/generated' \
            --exclude '.worktrees' \
            -e "ssh -i ~/.ssh/preview_key" \
            ./ "$ssh_target:$remote_source/"

      - name: Enforce preview capacity
        id: capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The host is a fixed-size box. Reclaim closed-PR environments, then evict the
          # least active, before adding one more. Without this the box fills until it
          # wedges and takes every preview down at once.
          gh pr list --state open --limit 200 \
            --json number,updatedAt,isDraft > /tmp/open-prs.json
          open_numbers="$(jq -r '[.[].number] | join(" ")' /tmp/open-prs.json)"
          activity="$(jq -r '.[] | "\(.number) \(.updatedAt | fromdateiso8601) \(if .isDraft then 1 else 0 end)"' /tmp/open-prs.json)"

          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          ssh -i ~/.ssh/preview_key "$ssh_target" \
            "cd '$remote_source' && PREVIEW_ROOT='$PREVIEW_ROOT' PREVIEW_MAX_ENVS='$PREVIEW_MAX_ENVS' KEEP_PR='$PR_NUMBER' OPEN_PR_NUMBERS='$open_numbers' PR_ACTIVITY='$activity' bash scripts/preview/enforce-cap.sh" \
            | tee /tmp/capacity.log

          evicted="$(awk -F= '/^CAP_EVICTED=/{print $2}' /tmp/capacity.log | tail -1)"
          result="$(awk -F= '/^CAP_RESULT=/{print $2}' /tmp/capacity.log | tail -1)"
          live="$(awk -F= '/^CAP_LIVE=/{print $2}' /tmp/capacity.log | tail -1)"
          echo "evicted=$evicted" >> "$GITHUB_OUTPUT"

          # Tell anyone whose preview was reclaimed, so it is never a silent disappearance.
          for pr in $evicted; do
            gh pr comment "$pr" --body "This PR's preview environment was reclaimed to stay under the ${PREVIEW_MAX_ENVS}-environment cap (it was among the least recently active). Nothing was lost — push any commit, or re-run the PR preview workflow, and it rebuilds." || true
          done

          if [ "$result" = "full" ]; then
            echo "::error::All ${PREVIEW_MAX_ENVS} preview slots are in use by active pull requests and none could be reclaimed. Close a PR or raise PREVIEW_MAX_ENVS."
            exit 1
          fi
          echo "Preview capacity OK: ${live}/${PREVIEW_MAX_ENVS} in use."

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          remote_env=(
            "PR_NUMBER=$(shell_quote "$PR_NUMBER")"
            "PREVIEW_DOMAIN=$(shell_quote "$PREVIEW_DOMAIN")"
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT")"
            "PREVIEW_TLS=$(shell_quote "$PREVIEW_TLS")"
            "PREVIEW_RUNTIME=$(shell_quote "$PREVIEW_RUNTIME")"
            "PREVIEW_DATA_MODE=$(shell_quote "$PREVIEW_DATA_MODE")"
            "PREVIEW_SEAT_COUNT=$(shell_quote "$PREVIEW_SEAT_COUNT")"
            "PREVIEW_AI_MODEL=$(shell_quote "$PREVIEW_AI_MODEL")"
            "PREVIEW_ANTHROPIC_API_KEY=$(shell_quote "$PREVIEW_ANTHROPIC_API_KEY")"
            "PREVIEW_DB_DUMP_S3_URI=$(shell_quote "$PREVIEW_DB_DUMP_S3_URI")"
            "PREVIEW_DB_PASSWORD=$(shell_quote "$PREVIEW_DB_PASSWORD")"
            "PREVIEW_DEV_LOGIN_EMAIL=$(shell_quote "$PREVIEW_DEV_LOGIN_EMAIL")"
            "PREVIEW_LOGIN_EMAIL=$(shell_quote "$PREVIEW_LOGIN_EMAIL")"
            "PREVIEW_LOGIN_PASSWORD=$(shell_quote "$PREVIEW_LOGIN_PASSWORD")"
            "SOURCE_DIR=$(shell_quote "$remote_source")"
          )
          ssh -i ~/.ssh/preview_key "$ssh_target" \
            "cd $(shell_quote "$remote_source") && ${remote_env[*]} bash scripts/preview/deploy.sh" \
            | tee /tmp/preview-deploy.log
          preview_url="$(awk -F= '/^PREVIEW_URL=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          access_code="$(awk -F= '/^PREVIEW_ACCESS_CODE=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          elapsed_ms="$(awk -F= '/^PREVIEW_ELAPSED_MS=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          test -n "$preview_url" || { echo "Deploy script did not print PREVIEW_URL"; exit 1; }
          test -n "$access_code" || { echo "Deploy script did not print PREVIEW_ACCESS_CODE"; exit 1; }
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "access_code=$access_code" >> "$GITHUB_OUTPUT"
          echo "elapsed_ms=${elapsed_ms:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Verify preview access gate
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          access_code="${{ steps.deploy.outputs.access_code }}"
          health="$(curl -sk -o /dev/null -m 15 -w '%{http_code}' "$url/api/healthcheck")"
          test "$health" = "200" || { echo "Healthcheck returned HTTP $health"; exit 1; }

          gated_page="$(curl -skL -m 15 "$url")"
          grep -q 'data-preview-access-screen' <<<"$gated_page" || {
            echo "Request without a preview access cookie did not render the access screen" >&2
            exit 1
          }

          blocked="$(curl -sk -o /dev/null -m 15 -w '%{http_code}' \
            -X POST --data-urlencode 'email=dev.admin@yawp.local' \
            "$url/auth/dev-login")"
          test "$blocked" = "401" || {
            echo "POST /auth/dev-login without an access cookie returned HTTP $blocked, expected 401" >&2
            exit 1
          }

          cookie_jar="$(mktemp)"
          entered="$(curl -sk -o /dev/null -m 15 -w '%{http_code}' -c "$cookie_jar" \
            --data-urlencode "code=$access_code" "$url/auth/preview-access")"
          case "$entered" in
            302|303) ;;
            *) echo "Access code returned HTTP $entered" >&2; exit 1 ;;
          esac
          app="$(curl -skL -o /dev/null -m 15 -w '%{http_code}' -b "$cookie_jar" "$url")"
          test "$app" = "200" || { echo "Code-bearing request returned HTTP $app"; exit 1; }
          echo "Access gate confirmed: health 200, no-cookie access screen, dev-login 401, code-bearing app 200"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview-${{ github.event.pull_request.number }}
          append: false
          message: |
            **PR preview**

            - **URL:** ${{ steps.deploy.outputs.url }}
            - **Access code:** `${{ steps.deploy.outputs.access_code }}`
            - **Runtime:** Docker Compose on the preview environment host
            - **Data:** seeded local-dev data in an isolated PR database
            - **Deploy elapsed:** `${{ steps.deploy.outputs.elapsed_ms }}ms`
            - **Smoke:** in-app access gate + dev login

  preview-destroy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[skip preview]') == false &&
      contains(github.event.pull_request.body, '[skip preview]') == false &&
      contains(github.event.pull_request.head.ref, '[skip preview]') == false
    runs-on: ubuntu-22.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_TLS: ${{ vars.PREVIEW_TLS || 'true' }}
      PREVIEW_RUNTIME: ${{ vars.PREVIEW_RUNTIME || 'fast' }}
    steps:
      - name: Check preview environment configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_DOMAIN" || { echo "Missing repository variable PREVIEW_DOMAIN"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Destroy preview
        run: |
          set -euo pipefail
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          ssh -i ~/.ssh/preview_key "$ssh_target" "\
            if test -x '$remote_source/scripts/preview/destroy.sh'; then \
              cd '$remote_source' && PR_NUMBER='$PR_NUMBER' PREVIEW_DOMAIN='$PREVIEW_DOMAIN' PREVIEW_ROOT='$PREVIEW_ROOT' PREVIEW_TLS='$PREVIEW_TLS' PREVIEW_RUNTIME='$PREVIEW_RUNTIME' bash scripts/preview/destroy.sh; \
            else \
              docker compose -p 'yawp-pr-${PR_NUMBER}' -f '${PREVIEW_ROOT}/previews/pr-${PR_NUMBER}/docker-compose.yml' down -v --remove-orphans || true; \
              rm -rf '${PREVIEW_ROOT}/previews/pr-${PR_NUMBER}'; \
            fi"

  preview-cleanup:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '72' }}
    steps:
      - name: Check preview cleanup configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Clean stale previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          open_pr_numbers="$(gh pr list --state open --limit 200 --json number --jq '.[].number' | tr '\n' ' ')"
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_env=(
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT")"
            "PREVIEW_TTL_HOURS=$(shell_quote "$PREVIEW_TTL_HOURS")"
            "OPEN_PR_NUMBERS=$(shell_quote "$open_pr_numbers")"
          )
          # Keep the cleanup script as a local redirect: bash -s < scripts/preview/cleanup.sh
          ssh -i ~/.ssh/preview_key "$ssh_target" "${remote_env[*]} bash -s" < scripts/preview/cleanup.sh
