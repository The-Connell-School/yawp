name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      diagnose_pr:
        description: 'PR number — dump that preview''s renderer state and logs (read-only, touches nothing)'
        required: false
        default: ''
      demo_render_pr:
        description: 'PR number — queue a known-good demo clip on that preview and wait for its renderer to film it end-to-end'
        required: false
        default: ''
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-deploy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[skip preview]') == false &&
      contains(github.event.pull_request.body, '[skip preview]') == false &&
      contains(github.event.pull_request.head.ref, '[skip preview]') == false
    runs-on: ubuntu-22.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_TLS: ${{ vars.PREVIEW_TLS || 'true' }}
      PREVIEW_RUNTIME: ${{ vars.PREVIEW_RUNTIME || 'fast' }}
      PREVIEW_MAX_ENVS: ${{ vars.PREVIEW_MAX_ENVS || '30' }}
      PREVIEW_DATA_MODE: ${{ vars.PREVIEW_DATA_MODE || 'seed' }}
      PREVIEW_AI_MODEL: ${{ vars.PREVIEW_AI_MODEL || 'claude-sonnet-4-6' }}
      PREVIEW_ANTHROPIC_API_KEY: ${{ secrets.PREVIEW_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
      PREVIEW_BASIC_AUTH: ${{ secrets.PREVIEW_BASIC_AUTH }}
      PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
      PREVIEW_DB_DUMP_S3_URI: ${{ vars.PREVIEW_DB_DUMP_S3_URI || 's3://yawp-preview-videos/production.dump' }}
      PREVIEW_DB_PASSWORD: ${{ secrets.PREVIEW_DB_PASSWORD }}
      PREVIEW_DEV_LOGIN_EMAIL: ${{ vars.PREVIEW_DEV_LOGIN_EMAIL || 'dev.teacher@yawp.local' }}
      PREVIEW_LOGIN_EMAIL: ${{ secrets.PREVIEW_LOGIN_EMAIL }}
      PREVIEW_LOGIN_PASSWORD: ${{ secrets.PREVIEW_LOGIN_PASSWORD }}
    steps:
      - name: Check preview environment configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_DOMAIN" || { echo "Missing repository variable PREVIEW_DOMAIN"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$PREVIEW_ANTHROPIC_API_KEY" || { echo "Missing repository secret PREVIEW_ANTHROPIC_API_KEY or ANTHROPIC_API_KEY"; exit 1; }
          test -n "$PREVIEW_BASIC_AUTH" || { echo "Missing repository secret PREVIEW_BASIC_AUTH"; exit 1; }
          test -n "$PREVIEW_BASIC_AUTH_PASSWORD" || { echo "Missing repository secret PREVIEW_BASIC_AUTH_PASSWORD"; exit 1; }
          case "$PREVIEW_DATA_MODE" in
            seed) ;;
            production-dump)
              [[ -n "$PREVIEW_DB_DUMP_S3_URI" ]] || { echo "Missing repository variable PREVIEW_DB_DUMP_S3_URI"; exit 1; }
              [[ -n "$PREVIEW_LOGIN_EMAIL" ]] || { echo "Missing repository secret PREVIEW_LOGIN_EMAIL"; exit 1; }
              [[ -n "$PREVIEW_LOGIN_PASSWORD" ]] || { echo "Missing repository secret PREVIEW_LOGIN_PASSWORD"; exit 1; }
              ;;
            *)
              echo "PREVIEW_DATA_MODE must be seed or production-dump"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to preview host
        run: |
          set -euo pipefail
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          ssh -i ~/.ssh/preview_key "$ssh_target" "mkdir -p '$remote_source'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'services/web-app/node_modules' \
            --exclude 'services/web-app/.react-router' \
            --exclude 'services/web-app/.vite' \
            --exclude 'packages/prisma/generated' \
            --exclude '.worktrees' \
            -e "ssh -i ~/.ssh/preview_key" \
            ./ "$ssh_target:$remote_source/"

      - name: Enforce preview capacity
        id: capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The host is a fixed-size box. Reclaim closed-PR environments, then evict the
          # least active, before adding one more. Without this the box fills until it
          # wedges and takes every preview down at once.
          gh pr list --state open --limit 200 \
            --json number,updatedAt,isDraft > /tmp/open-prs.json
          open_numbers="$(jq -r '[.[].number] | join(" ")' /tmp/open-prs.json)"
          activity="$(jq -r '.[] | "\(.number) \(.updatedAt | fromdateiso8601) \(if .isDraft then 1 else 0 end)"' /tmp/open-prs.json)"

          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          ssh -i ~/.ssh/preview_key "$ssh_target" \
            "cd '$remote_source' && PREVIEW_ROOT='$PREVIEW_ROOT' PREVIEW_MAX_ENVS='$PREVIEW_MAX_ENVS' KEEP_PR='$PR_NUMBER' OPEN_PR_NUMBERS='$open_numbers' PR_ACTIVITY='$activity' bash scripts/preview/enforce-cap.sh" \
            | tee /tmp/capacity.log

          evicted="$(awk -F= '/^CAP_EVICTED=/{print $2}' /tmp/capacity.log | tail -1)"
          result="$(awk -F= '/^CAP_RESULT=/{print $2}' /tmp/capacity.log | tail -1)"
          live="$(awk -F= '/^CAP_LIVE=/{print $2}' /tmp/capacity.log | tail -1)"
          echo "evicted=$evicted" >> "$GITHUB_OUTPUT"

          # Tell anyone whose preview was reclaimed, so it is never a silent disappearance.
          for pr in $evicted; do
            gh pr comment "$pr" --body "This PR's preview environment was reclaimed to stay under the ${PREVIEW_MAX_ENVS}-environment cap (it was among the least recently active). Nothing was lost — push any commit, or re-run the PR preview workflow, and it rebuilds." || true
          done

          if [ "$result" = "full" ]; then
            echo "::error::All ${PREVIEW_MAX_ENVS} preview slots are in use by active pull requests and none could be reclaimed. Close a PR or raise PREVIEW_MAX_ENVS."
            exit 1
          fi
          echo "Preview capacity OK: ${live}/${PREVIEW_MAX_ENVS} in use."

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          remote_env=(
            "PR_NUMBER=$(shell_quote "$PR_NUMBER")"
            "PREVIEW_DOMAIN=$(shell_quote "$PREVIEW_DOMAIN")"
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT")"
            "PREVIEW_TLS=$(shell_quote "$PREVIEW_TLS")"
            "PREVIEW_RUNTIME=$(shell_quote "$PREVIEW_RUNTIME")"
            "PREVIEW_DATA_MODE=$(shell_quote "$PREVIEW_DATA_MODE")"
            "PREVIEW_AI_MODEL=$(shell_quote "$PREVIEW_AI_MODEL")"
            "PREVIEW_ANTHROPIC_API_KEY=$(shell_quote "$PREVIEW_ANTHROPIC_API_KEY")"
            "PREVIEW_BASIC_AUTH=$(shell_quote "$PREVIEW_BASIC_AUTH")"
            "PREVIEW_BASIC_AUTH_PASSWORD=$(shell_quote "$PREVIEW_BASIC_AUTH_PASSWORD")"
            "PREVIEW_DB_DUMP_S3_URI=$(shell_quote "$PREVIEW_DB_DUMP_S3_URI")"
            "PREVIEW_DB_PASSWORD=$(shell_quote "$PREVIEW_DB_PASSWORD")"
            "PREVIEW_DEV_LOGIN_EMAIL=$(shell_quote "$PREVIEW_DEV_LOGIN_EMAIL")"
            "PREVIEW_LOGIN_EMAIL=$(shell_quote "$PREVIEW_LOGIN_EMAIL")"
            "PREVIEW_LOGIN_PASSWORD=$(shell_quote "$PREVIEW_LOGIN_PASSWORD")"
            "SOURCE_DIR=$(shell_quote "$remote_source")"
          )
          ssh -i ~/.ssh/preview_key "$ssh_target" \
            "cd $(shell_quote "$remote_source") && ${remote_env[*]} bash scripts/preview/deploy.sh" \
            | tee /tmp/preview-deploy.log
          preview_url="$(awk -F= '/^PREVIEW_URL=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          elapsed_ms="$(awk -F= '/^PREVIEW_ELAPSED_MS=/{print $2}' /tmp/preview-deploy.log | tail -1)"
          test -n "$preview_url" || { echo "Deploy script did not print PREVIEW_URL"; exit 1; }
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "elapsed_ms=${elapsed_ms:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview-${{ github.event.pull_request.number }}
          append: false
          message: |
            **PR preview**

            - **URL:** ${{ steps.deploy.outputs.url }}
            - **Runtime:** Docker Compose on the preview environment host
            - **Data:** seeded local-dev data in an isolated PR database
            - **Deploy elapsed:** `${{ steps.deploy.outputs.elapsed_ms }}ms`
            - **Smoke:** healthcheck + dev login

  preview-destroy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[skip preview]') == false &&
      contains(github.event.pull_request.body, '[skip preview]') == false &&
      contains(github.event.pull_request.head.ref, '[skip preview]') == false
    runs-on: ubuntu-22.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_TLS: ${{ vars.PREVIEW_TLS || 'true' }}
      PREVIEW_RUNTIME: ${{ vars.PREVIEW_RUNTIME || 'fast' }}
    steps:
      - name: Check preview environment configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_DOMAIN" || { echo "Missing repository variable PREVIEW_DOMAIN"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Destroy preview
        run: |
          set -euo pipefail
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_source="${PREVIEW_ROOT}/sources/pr-${PR_NUMBER}"
          ssh -i ~/.ssh/preview_key "$ssh_target" "\
            if test -x '$remote_source/scripts/preview/destroy.sh'; then \
              cd '$remote_source' && PR_NUMBER='$PR_NUMBER' PREVIEW_DOMAIN='$PREVIEW_DOMAIN' PREVIEW_ROOT='$PREVIEW_ROOT' PREVIEW_TLS='$PREVIEW_TLS' PREVIEW_RUNTIME='$PREVIEW_RUNTIME' bash scripts/preview/destroy.sh; \
            else \
              docker compose -p 'yawp-pr-${PR_NUMBER}' -f '${PREVIEW_ROOT}/previews/pr-${PR_NUMBER}/docker-compose.yml' down -v --remove-orphans || true; \
              rm -rf '${PREVIEW_ROOT}/previews/pr-${PR_NUMBER}'; \
            fi"

  # Pull a preview's renderer state and logs off the host without touching
  # anything: no restart, no database reset, no redeploy. The renderer is a
  # background worker whose failures happen after the deploy's snapshot of its
  # logs; this is the window into what it is doing right now.
  preview-diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.diagnose_pr != ''
    runs-on: ubuntu-22.04
    env:
      DIAGNOSE_PR: ${{ inputs.diagnose_pr }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
    steps:
      - name: Check diagnose configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }
          [[ "$DIAGNOSE_PR" =~ ^[0-9]+$ ]] || { echo "diagnose_pr must be a PR number, got: $DIAGNOSE_PR"; exit 1; }

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Dump renderer state and logs
        run: |
          set -euo pipefail
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          ssh -i ~/.ssh/preview_key "$ssh_target" "\
            set -x; \
            compose_file='${PREVIEW_ROOT}/previews/pr-${DIAGNOSE_PR}/docker-compose.yml'; \
            project='yawp-pr-${DIAGNOSE_PR}'; \
            docker compose -p \"\$project\" -f \"\$compose_file\" ps || true; \
            docker inspect --format 'renderer: {{.State.Status}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} started={{.State.StartedAt}}' \"\${project}-renderer-1\" || true; \
            docker compose -p \"\$project\" -f \"\$compose_file\" logs --tail=400 renderer || true; \
            docker compose -p \"\$project\" -f \"\$compose_file\" logs --tail=40 web || true; \
            docker exec preview-postgres psql -U postgres -d 'yawp_pr_${DIAGNOSE_PR}' -c 'SELECT id, status, kind, attempts, error, \"createdAt\" FROM \"MarketingMediaJob\" ORDER BY \"createdAt\" DESC LIMIT 5' || true; \
            docker exec preview-postgres psql -U postgres -d 'yawp_pr_${DIAGNOSE_PR}' -Atc 'SELECT storyboard FROM \"MarketingMediaJob\" ORDER BY \"createdAt\" DESC LIMIT 2' || true"

  # Proof-of-life for the whole studio pipeline, runnable without a human in
  # the admin UI: inserts a QUEUED job with a known-good storyboard into the
  # preview's database, then watches the preview's own renderer claim and film
  # it. The job and its media stay behind for the admin to watch in the
  # Marketing Studio. Fails if the render does not reach SUCCEEDED.
  preview-demo-render:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.demo_render_pr != ''
    runs-on: ubuntu-22.04
    env:
      DEMO_PR: ${{ inputs.demo_render_pr }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
    steps:
      - name: Check demo render configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }
          [[ "$DEMO_PR" =~ ^[0-9]+$ ]] || { echo "demo_render_pr must be a PR number, got: $DEMO_PR"; exit 1; }

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Queue a demo clip and watch the preview renderer film it
        run: |
          set -euo pipefail
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          ssh -i ~/.ssh/preview_key "$ssh_target" "DEMO_PR='$DEMO_PR' PREVIEW_DOMAIN='$PREVIEW_DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail
          db="yawp_pr_${DEMO_PR}"
          psql() { docker exec preview-postgres psql -U postgres -d "$db" "$@"; }

          admin_id="$(psql -Atc "SELECT id FROM \"User\" WHERE email='dev.admin@yawp.local' LIMIT 1")"
          test -n "$admin_id" || { echo "No seeded dev.admin user in $db — is this a seeded preview?"; exit 1; }

          job_id="demo-$(date +%s)"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO \"MarketingMediaJob\"
            (id, \"createdById\", kind, status, brief, \"subjectType\", \"targetUrl\", storyboard, attempts, \"updatedAt\")
            VALUES ('$job_id', '$admin_id', 'CLIP', 'QUEUED',
              'Automated proof render, queued by the preview-demo-render workflow.',
              'FEATURE', 'https://pr-${DEMO_PR}.${PREVIEW_DOMAIN}',
            \$sb\${\"slug\":\"daily-pages-prompt-library-proof\",\"title\":\"Daily Pages: Pick a Prompt, Create an Assignment\",\"audience\":\"Teachers\",\"goal\":\"Prove the studio renders end-to-end on this preview\",\"persona\":\"teacher\",\"viewport\":{\"width\":1280,\"height\":800},\"scenes\":[{\"id\":\"assignments-page\",\"goto\":\"/app/assignments\",\"waitFor\":\"table[aria-label='Assignments']\",\"settle\":0.8,\"hold\":0.5,\"screenshot\":false,\"steps\":[{\"action\":\"click\",\"role\":\"link\",\"name\":\"Daily Pages\"}]},{\"id\":\"prompt-library-open\",\"settle\":0.8,\"hold\":2,\"screenshot\":true,\"steps\":[{\"action\":\"waitFor\",\"role\":\"button\",\"name\":\"Prompt Library\"},{\"action\":\"click\",\"role\":\"button\",\"name\":\"Prompt Library\"},{\"action\":\"wait\",\"seconds\":0.6}]},{\"id\":\"select-prompt-new-assignment\",\"settle\":0.8,\"hold\":2.5,\"screenshot\":true,\"steps\":[{\"action\":\"waitFor\",\"role\":\"button\",\"name\":\"New Assignment\"},{\"action\":\"click\",\"role\":\"button\",\"name\":\"New Assignment\"},{\"action\":\"wait\",\"seconds\":0.5}]}]}\$sb\$::jsonb, 0, now())"

          echo "Queued $job_id — waiting for the preview renderer to claim and film it..."
          status="QUEUED"
          for i in $(seq 1 60); do
            status="$(psql -Atc "SELECT status FROM \"MarketingMediaJob\" WHERE id='$job_id'")"
            echo "poll $i: $status"
            case "$status" in SUCCEEDED|FAILED|CANCELLED) break;; esac
            sleep 5
          done

          psql -c "SELECT status, attempts, error FROM \"MarketingMediaJob\" WHERE id='$job_id'"
          psql -Atc "SELECT outputs FROM \"MarketingMediaJob\" WHERE id='$job_id'"
          docker exec "yawp-pr-${DEMO_PR}-renderer-1" ls -la "/media/marketing-media/$job_id/" || true

          test "$status" = "SUCCEEDED"
          echo "DEMO_RENDER_PROOF: job $job_id rendered end-to-end on the preview and its media is stored."
          REMOTE

  preview-cleanup:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.diagnose_pr == '' && inputs.demo_render_pr == '')
    runs-on: ubuntu-22.04
    env:
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '72' }}
    steps:
      - name: Check preview cleanup configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Clean stale previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          open_pr_numbers="$(gh pr list --state open --limit 200 --json number --jq '.[].number' | tr '\n' ' ')"
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_env=(
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT")"
            "PREVIEW_TTL_HOURS=$(shell_quote "$PREVIEW_TTL_HOURS")"
            "OPEN_PR_NUMBERS=$(shell_quote "$open_pr_numbers")"
          )
          # Keep the cleanup script as a local redirect: bash -s < scripts/preview/cleanup.sh
          ssh -i ~/.ssh/preview_key "$ssh_target" "${remote_env[*]} bash -s" < scripts/preview/cleanup.sh
