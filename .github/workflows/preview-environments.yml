name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[skip preview]') == false &&
      contains(github.event.pull_request.body, '[skip preview]') == false &&
      contains(github.event.pull_request.head.ref, '[skip preview]') == false
    runs-on: ubuntu-22.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_FORGE_HOST: ${{ vars.PREVIEW_FORGE_HOST }}
      PREVIEW_FORGE_DOMAIN: ${{ vars.PREVIEW_FORGE_DOMAIN }}
      PREVIEW_FORGE_ROOT: ${{ vars.PREVIEW_FORGE_ROOT || '/srv/yawp-preview-forge' }}
      PREVIEW_FORGE_SSH_USER: ${{ vars.PREVIEW_FORGE_SSH_USER || 'ec2-user' }}
      PREVIEW_FORGE_TLS: ${{ vars.PREVIEW_FORGE_TLS || 'true' }}
      PREVIEW_FORGE_RUNTIME: ${{ vars.PREVIEW_FORGE_RUNTIME || 'fast' }}
      PREVIEW_DB_DUMP_S3_URI: ${{ vars.PREVIEW_DB_DUMP_S3_URI || 's3://yawp-preview-videos/production.dump' }}
      PREVIEW_LOGIN_EMAIL: ${{ secrets.PREVIEW_LOGIN_EMAIL }}
      PREVIEW_LOGIN_PASSWORD: ${{ secrets.PREVIEW_LOGIN_PASSWORD }}
    steps:
      - name: Check preview environment configuration
        env:
          PREVIEW_FORGE_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_FORGE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_FORGE_HOST" || { echo "Missing repository variable PREVIEW_FORGE_HOST"; exit 1; }
          test -n "$PREVIEW_FORGE_DOMAIN" || { echo "Missing repository variable PREVIEW_FORGE_DOMAIN"; exit 1; }
          test -n "$PREVIEW_FORGE_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_FORGE_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$PREVIEW_DB_DUMP_S3_URI" || { echo "Missing repository variable PREVIEW_DB_DUMP_S3_URI"; exit 1; }
          test -n "$PREVIEW_LOGIN_EMAIL" || { echo "Missing repository secret PREVIEW_LOGIN_EMAIL"; exit 1; }
          test -n "$PREVIEW_LOGIN_PASSWORD" || { echo "Missing repository secret PREVIEW_LOGIN_PASSWORD"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PREVIEW_FORGE_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_FORGE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_FORGE_SSH_PRIVATE_KEY" > ~/.ssh/preview_forge_key
          chmod 600 ~/.ssh/preview_forge_key
          ssh-keyscan -H "$PREVIEW_FORGE_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to preview host
        run: |
          set -euo pipefail
          remote_source="${PREVIEW_FORGE_ROOT}/sources/pr-${PR_NUMBER}"
          ssh_target="${PREVIEW_FORGE_SSH_USER}@${PREVIEW_FORGE_HOST}"
          ssh -i ~/.ssh/preview_forge_key "$ssh_target" "mkdir -p '$remote_source'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'services/web-app/node_modules' \
            --exclude 'services/web-app/.react-router' \
            --exclude 'services/web-app/.vite' \
            --exclude 'packages/prisma/generated' \
            --exclude '.worktrees' \
            -e "ssh -i ~/.ssh/preview_forge_key" \
            ./ "$ssh_target:$remote_source/"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create masked dump URL
        id: preview-dump-url
        run: |
          set -euo pipefail
          dump_url=""
          if [[ "$PREVIEW_DB_DUMP_S3_URI" == s3://* ]]; then
            dump_url="$(aws s3 presign "$PREVIEW_DB_DUMP_S3_URI" --expires-in 21600)"
          fi
          if [[ -n "$dump_url" ]]; then
            echo "::add-mask::$dump_url"
          fi
          printf 'url=%s\n' "$dump_url" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        id: deploy
        env:
          PREVIEW_DB_DUMP_URL: ${{ steps.preview-dump-url.outputs.url }}
        run: |
          set -euo pipefail
          shell_quote() {
            printf '%q' "$1"
          }
          ssh_target="${PREVIEW_FORGE_SSH_USER}@${PREVIEW_FORGE_HOST}"
          remote_source="${PREVIEW_FORGE_ROOT}/sources/pr-${PR_NUMBER}"
          remote_env=(
            "PR_NUMBER=$(shell_quote "$PR_NUMBER")"
            "PREVIEW_FORGE_DOMAIN=$(shell_quote "$PREVIEW_FORGE_DOMAIN")"
            "PREVIEW_FORGE_ROOT=$(shell_quote "$PREVIEW_FORGE_ROOT")"
            "PREVIEW_FORGE_TLS=$(shell_quote "$PREVIEW_FORGE_TLS")"
            "PREVIEW_FORGE_RUNTIME=$(shell_quote "$PREVIEW_FORGE_RUNTIME")"
            "PREVIEW_DB_DUMP_S3_URI=$(shell_quote "$PREVIEW_DB_DUMP_S3_URI")"
            "PREVIEW_DB_DUMP_URL=$(shell_quote "$PREVIEW_DB_DUMP_URL")"
            "PREVIEW_LOGIN_EMAIL=$(shell_quote "$PREVIEW_LOGIN_EMAIL")"
            "PREVIEW_LOGIN_PASSWORD=$(shell_quote "$PREVIEW_LOGIN_PASSWORD")"
            "SOURCE_DIR=$(shell_quote "$remote_source")"
          )
          ssh -i ~/.ssh/preview_forge_key "$ssh_target" \
            "cd $(shell_quote "$remote_source") && ${remote_env[*]} bash scripts/preview-forge/deploy.sh" \
            | tee /tmp/preview-forge-deploy.log
          preview_url="$(awk -F= '/^PREVIEW_URL=/{print $2}' /tmp/preview-forge-deploy.log | tail -1)"
          elapsed_ms="$(awk -F= '/^PREVIEW_ELAPSED_MS=/{print $2}' /tmp/preview-forge-deploy.log | tail -1)"
          test -n "$preview_url" || { echo "Deploy script did not print PREVIEW_URL"; exit 1; }
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "elapsed_ms=${elapsed_ms:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview-${{ github.event.pull_request.number }}
          append: false
          message: |
            **PR preview**

            - **URL:** ${{ steps.deploy.outputs.url }}
            - **Runtime:** Docker Compose on the preview environment host
            - **Data:** production database dump restored into an isolated Postgres volume
            - **Deploy elapsed:** `${{ steps.deploy.outputs.elapsed_ms }}ms`
            - **Smoke:** healthcheck + login

  preview-destroy:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[skip preview]') == false &&
      contains(github.event.pull_request.body, '[skip preview]') == false &&
      contains(github.event.pull_request.head.ref, '[skip preview]') == false
    runs-on: ubuntu-22.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_FORGE_HOST: ${{ vars.PREVIEW_FORGE_HOST }}
      PREVIEW_FORGE_DOMAIN: ${{ vars.PREVIEW_FORGE_DOMAIN }}
      PREVIEW_FORGE_ROOT: ${{ vars.PREVIEW_FORGE_ROOT || '/srv/yawp-preview-forge' }}
      PREVIEW_FORGE_SSH_USER: ${{ vars.PREVIEW_FORGE_SSH_USER || 'ec2-user' }}
      PREVIEW_FORGE_TLS: ${{ vars.PREVIEW_FORGE_TLS || 'true' }}
      PREVIEW_FORGE_RUNTIME: ${{ vars.PREVIEW_FORGE_RUNTIME || 'fast' }}
    steps:
      - name: Check preview environment configuration
        env:
          PREVIEW_FORGE_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_FORGE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_FORGE_HOST" || { echo "Missing repository variable PREVIEW_FORGE_HOST"; exit 1; }
          test -n "$PREVIEW_FORGE_DOMAIN" || { echo "Missing repository variable PREVIEW_FORGE_DOMAIN"; exit 1; }
          test -n "$PREVIEW_FORGE_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_FORGE_SSH_PRIVATE_KEY"; exit 1; }

      - name: Prepare SSH
        env:
          PREVIEW_FORGE_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_FORGE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_FORGE_SSH_PRIVATE_KEY" > ~/.ssh/preview_forge_key
          chmod 600 ~/.ssh/preview_forge_key
          ssh-keyscan -H "$PREVIEW_FORGE_HOST" >> ~/.ssh/known_hosts

      - name: Destroy preview
        run: |
          set -euo pipefail
          ssh_target="${PREVIEW_FORGE_SSH_USER}@${PREVIEW_FORGE_HOST}"
          remote_source="${PREVIEW_FORGE_ROOT}/sources/pr-${PR_NUMBER}"
          ssh -i ~/.ssh/preview_forge_key "$ssh_target" "\
            if test -x '$remote_source/scripts/preview-forge/destroy.sh'; then \
              cd '$remote_source' && PR_NUMBER='$PR_NUMBER' PREVIEW_FORGE_DOMAIN='$PREVIEW_FORGE_DOMAIN' PREVIEW_FORGE_ROOT='$PREVIEW_FORGE_ROOT' PREVIEW_FORGE_TLS='$PREVIEW_FORGE_TLS' PREVIEW_FORGE_RUNTIME='$PREVIEW_FORGE_RUNTIME' bash scripts/preview-forge/destroy.sh; \
            else \
              docker compose -p 'yawp-pr-${PR_NUMBER}' -f '${PREVIEW_FORGE_ROOT}/previews/pr-${PR_NUMBER}/docker-compose.yml' down -v --remove-orphans || true; \
              rm -rf '${PREVIEW_FORGE_ROOT}/previews/pr-${PR_NUMBER}'; \
            fi"
