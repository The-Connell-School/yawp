  e2e-browser-checks:
    needs: [paths]
    if: ${{ needs.paths.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: 🧪 Demo feedback + preview access browser checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:f9d1e581cde3e4c8bc696b07e6f7b7aea1d41014b33a52b27990762daae61beb # postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fixture steps isolate XDG_CACHE_HOME; keep browser lookup on the shared CI cache path.
      - name: Configure Playwright browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${HOME}/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: ⎔ Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.4.4'

      - name: 💾 Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e

      # Keyed on the resolved version from bun.lock so lockfile bumps invalidate stale browsers.

      - name: 🔖 Resolve Playwright version
        id: playwright-version
        run: |
          echo "version=$(bash scripts/ci/resolve-playwright-version.sh)" >> "$GITHUB_OUTPUT"

      - name: 💾 Restore Playwright browsers cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        working-directory: services/web-app
        timeout-minutes: 28
        env:
          PLAYWRIGHT_INSTALL_ATTEMPT_TIMEOUT: 12m
        run: bash ../../scripts/ci/install-playwright-chromium.sh "${{ steps.playwright-cache.outputs.cache-hit }}"

      - name: Verify demo feedback headless browser executable
        working-directory: services/web-app
        env:
          TMPDIR: ${{ runner.temp }}/demo-feedback
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/demo-feedback/bun-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/demo-feedback/cache
        run: |
          mkdir -p "$TMPDIR"
          version=$(node -p "require('@playwright/test/package.json').version")
          actual_version=$(bun x playwright --version)
          if [ "$actual_version" != "Version $version" ]; then
            echo "::error::Fixture runner $actual_version does not match installed Playwright $version"
            exit 1
          fi
          shell_dir=$(bun x playwright install --dry-run --only-shell chromium | sed -n 's/^ *Install location: *\(.*chromium_headless_shell[^ ]*\) *$/\1/p')
          executable="$shell_dir/chrome-headless-shell-linux64/chrome-headless-shell"
          if [ -z "$shell_dir" ] || [ ! -x "$executable" ]; then
            echo "::error::Missing Playwright $version chrome-headless-shell executable: $executable (PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH)"
            exit 1
          fi

      - name: Demo feedback local fixture browser regression
        env:
          CI: '1'
          # The fixture targets IPv4; Vite's default localhost bind must match it.
          NODE_OPTIONS: --dns-result-order=ipv4first
          TMPDIR: ${{ runner.temp }}/demo-feedback
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/demo-feedback/bun-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/demo-feedback/cache
          RECORD_PORT_APP: '5489'
          RECORD_PORT_DATABASE: '54489'
          RECORD_PORT_LTI_MOCK: '9789'
          YAWP_ENVIRONMENT: demo
          PREVIEW_SLUG: demo
          TESTER_FEEDBACK_ENABLED: 'true'
          FREE_TIER_LINK_HMAC_SECRET: ci-free-tier-link-hmac-secret-key-32b
          DEV_PANEL_EVIDENCE_DIR: dev-panel-evidence
          DEV_PANEL_ARTIFACT_COPY_DIR: /opt/cursor/artifacts/screenshots
          RESEND_API_KEY: ''
          RESEND_FROM_EMAIL: ''
        run: |
          mkdir -p "$TMPDIR" services/web-app/dev-panel-evidence
          cleanup() {
            ./bin/project dev stop --json || true
            if [ -f .worktree-local/config.env ]; then
              source .worktree-local/config.env
              docker rm -f "$CONTAINER_NAME" || true
              docker volume rm "$VOLUME_NAME" || true
            fi
          }
          trap cleanup EXIT
          ./bin/project bootstrap --fresh --json
          ./bin/project fixture verify local-dev --json
          ./bin/project dev start --json
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5489/ > /dev/null
          ./bin/project test --profile demo-feedback-browser --json

      - name: Cat dev panel free-tier jump log
        if: ${{ !cancelled() && always() }}
        run: |
          if [ -f services/web-app/test-results/dev-panel-free-tier-jump.log ]; then
            cat services/web-app/test-results/dev-panel-free-tier-jump.log
          else
            echo "(no dev-panel free-tier jump log)"
          fi
          if [ -f .worktree-local/dev.log ]; then
            grep '\[dev-panel free-tier jump failed\]' .worktree-local/dev.log || true
          fi

      - name: Assert dev panel free-tier jump catalog complete
        if: ${{ !cancelled() && always() }}
        run: |
          log=services/web-app/test-results/dev-panel-free-tier-jump.log
          if [ ! -f "$log" ]; then
            echo "::error::Missing dev-panel free-tier jump log"
            exit 1
          fi
          ok_count=$(grep -cE '^[^#[:space:]].*: ok$' "$log" || true)
          if [ "$ok_count" -ne 16 ]; then
            echo "::error::Expected 16 catalog jump ok lines, found $ok_count"
            exit 1
          fi

      - name: Dev panel signed-out /free browser regression
        if: ${{ !cancelled() && always() }}
        env:
          CI: '1'
          NODE_OPTIONS: --dns-result-order=ipv4first
          TMPDIR: ${{ runner.temp }}/dev-panel-free-signed-out
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/dev-panel-free-signed-out/bun-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/dev-panel-free-signed-out/cache
          RECORD_PORT_APP: '5490'
          RECORD_PORT_DATABASE: '54490'
          RECORD_PORT_LTI_MOCK: '9790'
          YAWP_ENVIRONMENT: demo
          PREVIEW_SLUG: demo
          PREVIEW_ACCESS_GATE: 'on'
          PREVIEW_ACCESS_SECRET: 'ci-demo-feedback-preview-access-secret-32c'
          PREVIEW_MASTER_ACCESS_CODE: 'ci-demo-master-access'
          PREVIEW_ACCESS_SEATS: '[{"code":"ci-fixture-4193","organizationId":"local-dev-org","label":"Master"}]'
          TESTER_FEEDBACK_ENABLED: 'true'
          DEMO_FEEDBACK_BASE_URL: http://127.0.0.1:5490
        run: |
          mkdir -p "$TMPDIR"
          cleanup() {
            ./bin/project dev stop --json || true
            if [ -f .worktree-local/config.env ]; then
              source .worktree-local/config.env
              docker rm -f "$CONTAINER_NAME" || true
              docker volume rm "$VOLUME_NAME" || true
            fi
          }
          trap cleanup EXIT
          ./bin/project bootstrap --fresh --json
          ./bin/project fixture verify local-dev --json
          ./bin/project dev start --json
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5490/ > /dev/null
          cd services/web-app
          bun x playwright test --config=playwright.dev-panel-free-signed-out.config.ts --workers=1

      - name: Upload dev panel artboard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-panel-artboard-evidence-${{ github.run_id }}
          path: services/web-app/dev-panel-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: 🔐 Run preview access gate tests
        working-directory: services/web-app
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e
        run: bun run test:e2e:preview-access

      - name: Upload Playwright results on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-browser-checks-results-${{ github.run_id }}
          path: |
            services/web-app/test-results/
            services/web-app/playwright-report/
          retention-days: 7

  # One HTML report for all smoke shards (non-gating; download the artifact on failure).
  e2e-report:
    needs: [e2e-smoke]
    if: ${{ !cancelled() && needs.e2e-smoke.result != 'skipped' }}
    name: 📊 Merge E2E smoke reports
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.4.4'

      - name: 💾 Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📥 Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: services/web-app/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: 🧩 Merge into one HTML report
        working-directory: services/web-app
        run: |
          if ls all-blob-reports/*.zip >/dev/null 2>&1; then
            bun x playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "No blob reports to merge."
          fi

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: services/web-app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Keeps the original check name. Passes when every E2E job passed, or when
  # they were skipped on purpose (draft PR or no code changes).
  e2e-web-app:
    needs: [paths, e2e-smoke, e2e-signon, e2e-browser-checks]
    if: ${{ always() }}
    name: 🧪 E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - name: ✅ Check E2E results
        env:
          RESULTS: ${{ needs.paths.result }} ${{ needs.e2e-smoke.result }} ${{ needs.e2e-signon.result }} ${{ needs.e2e-browser-checks.result }}
        run: |
          echo "paths, smoke, sign-on, browser checks: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::An E2E job ended with: $r"; exit 1 ;;
            esac
          done
