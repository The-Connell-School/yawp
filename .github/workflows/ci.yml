name: CI
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  paths:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      preview_tooling: ${{ steps.filter.outputs.preview_tooling }}
      prisma: ${{ steps.filter.outputs.prisma }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
      - name: 🔍 Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # scripts/** is included in the core code filter so the Prisma job
            # runs deployment-contract and mock-contract tests on script-only PRs.
            # These tests live under scripts/ and must execute even when no
            # packages/** or services/** paths changed.
            code:
              - 'services/**'
              - 'packages/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'pnpm-lock.yaml'
              - 'yarn.lock'
              - 'package-lock.json'
              - 'tsconfig*'
              - 'bin/**'
              - 'Dockerfile*'
              - 'bunfig.toml'
              - 'playwright.config.*'
            preview_tooling:
              - 'scripts/preview/**'
            prisma:
              - 'packages/prisma/**'
  # CI names every test file it runs, so a test file that is merely present never executes.
  # scripts/preview/*.test.js sat unrun for exactly that reason. It matters most here:
  # enforce-cap.sh removes trees as root before every deploy, and the ownership case it
  # guards can only be reproduced where bind mounts pass real UIDs through — which is
  # Linux, not a macOS workstation. This job is where that coverage actually happens.
  validate-preview-tooling:
    needs: [paths]
    name: Preview tooling
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3
      - name: ⏭️ Skip (no preview tooling changes)
        if: ${{ needs.paths.outputs.preview_tooling != 'true' }}
        run: echo "No scripts/preview changes; skipping heavy steps."

      - name: 📥 Setup Bun
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        run: bun install --frozen-lockfile

      # The root-owned-build-output test needs the image the preview host itself runs.
      - name: 🐳 Pull the preview runtime image
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        run: docker pull oven/bun:1.3.1

      # Fail rather than skip if the runner cannot produce root-owned files: a silent skip
      # here would leave the regression uncovered everywhere.
      - name: 🧪 Preview tooling tests
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        env:
          ENFORCE_CAP_REQUIRE_ROOT_OWNERSHIP: '1'
          # Exercise the real Postgres role/ACL migration on Linux. Local macOS runs
          # may leave this opt-in because the test launches its own Postgres container.
          PREVIEW_DATABASE_ROLE_INTEGRATION: '1'
        run: bun test ./scripts/preview/ --timeout 180000

  validate-prisma-migrations:
    needs: [paths]
    name: Prisma migrations
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3
      - name: ⏭️ Skip (no Prisma or core/code changes)
        if: ${{ !(needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true') }}
        run: echo "No packages/prisma changes; skipping heavy steps."

      - name: 📥 Setup Bun
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun install --frozen-lockfile

      # bunfig.toml preloads services/web-app/test-preload.ts for every `bun test` run in
      # this repo, and that preload imports ~/utils/auth.server, which imports @app/prisma.
      # The generated client therefore has to exist before the first test step, not just
      # before the migration steps below. `prisma generate` reads the schema only — it does
      # not connect — so it can run before the validation database is created.
      - name: ⚙️ Generate Prisma Client
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun prisma generate

      - name: 🧪 Validate deployment contract
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./scripts/deployment-contract.test.ts

      - name: 🧪 Validate Blackboard LTI mock
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./scripts/blackboard-lti-mock/ --timeout 60000

      - name: 🧪 Validate read-only impersonation contract
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./scripts/read-only-impersonation-contract.test.ts

      - name: 🧰 Install Postgres client
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 🛠️ Create migration validation database
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres yawp_migration_ci

      - name: 🧪 Validate teacher training assignment migration data swap
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./packages/prisma/scripts/teacher-training-assignment-migration.test.ts

      # Daily Pages consolidation: migration simulation + Class Starter seed contract.
      - name: 🧪 Daily Pages engagement migration + Class Starter seed
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: |
          bun test ./packages/prisma/scripts/daily-pages-engagement-migration.test.ts
          bun test ./packages/prisma/scripts/daily-pages-engagement-migration.integration.test.ts
          bun test ./packages/prisma/scripts/apply-daily-pages-engagement-v2-seed.test.ts
          bun test ./packages/prisma/scripts/seed-class-starter-assignment-type.test.ts

      - name: 🧱 Apply Prisma migrations
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun prisma migrate deploy

      - name: 🧪 Exit ticket bootstrap migration idempotency
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./packages/prisma/scripts/exit-ticket-bootstrap-migration.test.ts

      - name: 🧪 Free tier bundle seed connection (tunnel TLS)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./packages/prisma/scripts/seed-free-tier-bundle-assignment-types.test.ts

      - name: 🌱 Seed free tier bundle assignment types
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun run --cwd packages/prisma seed-free-tier-bundle-assignment-types

      # CI names every test file it runs, and nothing ran services/web-app/app/**
      # unit tests: the rate limiter, client-IP and free-tier tests were present but
      # never executed. These need the migrated database above (real SQL), so they
      # live in this job. Add new web-app test files here.
      - name: 🧪 Web app unit + DB tests (rate limits, client IP, free tier)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          RATE_LIMIT_DB_TESTS: '1'
          FREE_TIER_DB_TESTS: '1'
          RUBRIC_CATALOG_DB_TESTS: '1'
          FEATURE_FLAG_DB_TESTS: '1'
        run: >-
          bun test
          ./services/web-app/app/domain/rubrics/rubric-catalog.test.ts
          ./services/web-app/app/domain/rubrics/rubric-catalog.integration.test.ts
          ./services/web-app/app/domain/rubrics/internal-demo-rubrics.integration.test.ts
          ./services/web-app/app/utils/internal-rubric-catalog-http.server.test.ts
          ./services/web-app/app/utils/ip.server.test.ts
          ./services/web-app/app/utils/rate-limit.server.test.ts
          ./services/web-app/app/utils/login-rate-limit-target.test.ts
          ./services/web-app/app/utils/rate-limit.false-positive.test.ts
          ./services/web-app/app/utils/rate-limit.responses.test.ts
          ./services/web-app/app/utils/preview-access-rate-limit.server.test.ts
          ./services/web-app/app/utils/internal-free-tier-http.server.test.ts
          $(find ./services/web-app/app/domain/free-tier -name '*.test.ts' ! -name 'student-join.server.test.ts')
          ./services/web-app/app/routes/api.free-tier.waitlist/route.integration.test.ts
          ./packages/prisma/scripts/free-tier-real-db.integration.test.ts
          ./services/web-app/app/utils/free-tier-class-create-route.real-db.integration.test.ts
          ./services/web-app/app/routes/app/sidebar-nav.reporter.test.ts
          ./services/web-app/app/utils/assignment-quota.real-db.integration.test.ts
          ./packages/prisma/preview-access-code.free-classroom.test.ts
          ./packages/prisma/scripts/preview-seats.test.ts
          ./services/web-app/app/domain/feature-flags/feature-flags.integration.test.ts
          ./services/web-app/app/domain/submissions/student-submission-grade-visibility.server.test.ts
          './services/web-app/app/routes/app_.submissions_.$submissionId/route.loader.test.ts'
          './services/web-app/app/routes/app_.submissions_.$submissionId/submission-rubric-config.server.test.ts'
          './services/web-app/app/domain/grading/rubric-display.test.ts'
          './services/web-app/app/domain/assignment-types/daily-pages-engagement-rubric.test.ts'
          './services/web-app/app/routes/app.assignment-types.$id/route.test.ts'
          './services/web-app/app/routes/app_.documents_.$id/route.test.ts'
          ./services/web-app/e2e/decode-router-data.test.ts
          # decode-router-data: turbo .data assertions in student.unreleased-grade-loader-privacy E2E

      - name: 🎨 Backfill class artwork keys
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun run --cwd packages/prisma backfill-class-art-key

      - name: 🧪 Assignment type release gate
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun run --cwd packages/prisma assignment-type-release-gate

      # Last, because it truncates every table before it writes.
      #
      # The seed is what a preview runs against a fresh database, and until now
      # nothing ran it before a preview did. `packages/prisma/scripts` is outside
      # the web app's tsconfig, so typecheck does not reach it either — a call
      # that no longer matches its function surfaced as a failed deploy rather
      # than a failed check. This runs the same sequence against the same kind of
      # database.
      #
      # It does not catch everything the deploy can hit: a package the Prisma
      # workspace imports without declaring resolves fine here, because a plain
      # install hoists it to the root, and only fails where node_modules is laid
      # out differently. Declaring what the seed imports is the guard for that.
      - name: 🌱 Seed local-dev data
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun run --cwd packages/prisma seed-local-dev

      # Entitlements/reporter-gate tests were never run by CI. Each file mocks
      # different modules, so they run in separate bun processes. The DB test
      # runs against the freshly migrated database.
      - name: 🧪 Entitlements + reporter gate tests
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        working-directory: services/web-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: |
          bun test app/utils/entitlements.server.test.ts
          bun test app/utils/reporter/reporter-access.server.test.ts
          bun test app/utils/auth.server.test.ts
          bun test app/routes/auth.login/login.server.test.ts
          bun test app/utils/entitlements.db.test.ts

      # Mocks prisma; must not share a bun process with real-DB rate limit tests.
      - name: 🧪 Login limiter fail-closed timeout
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        working-directory: services/web-app
        run: bun test app/utils/login-rate-limit.fail-closed.test.ts

  typecheck-web-app:
    needs: [paths]
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3
      - name: ⏭️ Skip (no code changes)
        if: ${{ needs.paths.outputs.code != 'true' }}
        run: echo "No code changes; skipping heavy steps."

      - name: ⎔ Setup node
        if: ${{ needs.paths.outputs.code == 'true' }}
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: 📥 Download deps
        if: ${{ needs.paths.outputs.code == 'true' }}
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        if: ${{ needs.paths.outputs.code == 'true' }}
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        if: ${{ needs.paths.outputs.code == 'true' }}
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_typecheck

      - name: 🔎 Type check
        if: ${{ needs.paths.outputs.code == 'true' }}
        run: bun web-app:typecheck

      # CI did not run any web-app unit tests before; name the AI usage log
      # suites here so a regression in attribution or IP hashing fails the PR.
      - name: 🧪 AI usage log unit tests
        if: ${{ needs.paths.outputs.code == 'true' }}
        working-directory: services/web-app
        run: bun test app/utils/ai-usage-log.server.test.ts app/utils/getLLMCompletion/getLLMCompletion.test.ts

      # Free-tier / enrollment suites also mock Prisma; run isolated like Daily Pages.
      # The Daily Pages paragraph-type / writing-time feature flag. These suites
      # replace modules with mocks, which leak across files in one bun process,
      # so each runs on its own.
      - name: Feature flag unit tests
        if: ${{ needs.paths.outputs.code == 'true' }}
        working-directory: services/web-app
        run: |
          set -e
          for f in \
            app/domain/feature-flags/feature-flags.test.ts \
            app/domain/feature-flags/feature-flags.server.test.ts \
            app/utils/internal-feature-flags-http.server.test.ts \
            app/domain/rubrics/rubric-promotion.test.ts \
            app/domain/assignment-types/assignment-type-grading-config.server.test.ts \
            app/domain/assignment-types/assignment-type-rubric-config.test.ts \
            app/domain/grading/gradeMath.test.ts \
            app/routes/api.domain.update-submission/route.test.ts \
            'app/routes/app_.submissions_.$submissionId/teacher-grading/view-panel.test.tsx' \
            app/domain/reporter/reporter-report.test.ts \
            app/routes/api.assignments.create/route.test.ts \
            app/routes/app.assignments._index/route.test.ts \
            app/routes/app._index/route.test.ts \
            app/routes/app.my-classes._index/route.test.ts \
            app/utils/assignment-quota.server.test.ts \
            app/domain/free-tier/provision-free-classroom.server.test.ts \
            app/components/assignments/assignment-creation-sheet.test.tsx \
            app/routes/api.domain.grade-essay-ai/route.test.ts \
            app/domain/assignment-insights/class-insight-generation.server.test.ts \
            'app/routes/app.assignments.$assignmentId._index/route.test.ts' \
            'app/routes/app.my-classes.$classId/route.test.ts' \
            'app/routes/app.my-classes.$classId/class-student-enrollment.server.test.ts' \
            'app/utils/impersonation-read-only.server.test.ts' \
            'app/utils/internal-management.server.test.ts' \
            'app/domain/free-tier/student-join.server.test.ts' \
            'app/routes/app.assignment-types.$id/about-daily-pages/content.test.ts' \
            app/domain/assignment-types/assignment-type-grading-config.server.test.ts \
            app/domain/assignment-types/daily-pages-assignment-points.test.ts \
            app/domain/assignment-types/daily-pages-engagement-tier-bands.test.ts \
            app/domain/ai-evaluation/grading-assistant-benchmark-run.server.test.ts \
            'app/routes/app.admin.assignment-types.$id_.prompt/route.test.ts' \
            app/routes/api.domain.assignment-type-evaluations/route.test.ts \
            'app/routes/app_.submissions_.$submissionId/route.loader.test.ts' \
            'app/routes/app.assignment-types.$id/prompts-library/library-variant.test.ts' \
            app/routes/api.domain.lesson-planner/route.test.ts \
            app/routes/api.domain.lesson-planner.packet/route.test.ts \
            app/domain/lesson-planner/artifact-from-reply.test.ts \
            app/domain/lesson-planner/lesson-pdf.server.test.ts \
            app/domain/lesson-planner/lesson-packet.test.ts \
            app/utils/lesson-planner/lesson-planner-access.server.test.ts \
            app/utils/lesson-planner/lesson-planner-quota.server.test.ts \
            app/utils/lesson-planner/lesson-planner-admission.server.test.ts \
            ../../packages/prisma/scripts/bootstrap-exit-ticket-assignment-type.test.ts \
            ../../packages/prisma/scripts/seed-preview-planner-qa.test.ts \
            ../../packages/prisma/scripts/exit-ticket-migration-image.test.ts \
            ../../packages/prisma/scripts/preview-seats.test.ts \
            app/domain/lesson-planner/lesson-seed.test.ts
          do
            bun test "$f"
          done

  e2e-web-app:
    needs: [typecheck-web-app, validate-prisma-migrations, paths]
    name: 🧪 E2E Tests (Playwright)
    runs-on: ubuntu-22.04
    # The browser download hung for five hours on 2026-08-18 and would have run
    # to GitHub's six-hour default before failing. Nothing about this job is
    # worth half a day of a runner: the tests themselves take about seven
    # minutes, so anything past half an hour is wedged, not slow.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3
      - name: ⏭️ Skip (draft PR or no code changes)
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.draft || needs.paths.outputs.code != 'true') }}
        run: echo "Draft PR or no code changes; skipping heavy steps."

      - name: ⎔ Setup node
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: 📥 Setup Bun
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e

      # Keyed on the resolved version rather than a hardcoded one, so a bump in
      # package.json invalidates the cache instead of restoring browsers that no
      # longer match the runner.
      - name: 🔖 Resolve Playwright version
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        id: playwright-version
        working-directory: services/web-app
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache Playwright browsers
        id: playwright-cache
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Chromium only. On a browser cache hit, install the binary only — apt deps
      # are already on the runner and `install-deps` has timed out on cache hits.
      - name: Install Playwright chromium
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        working-directory: services/web-app
        timeout-minutes: 15
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx --package "@playwright/test@${version}" playwright install chromium
          else
            bunx --package "@playwright/test@${version}" playwright install --with-deps chromium
          fi

      - name: 🧪 Run Playwright tests
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        working-directory: services/web-app
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e
        run: bun run test:e2e:smoke

      # HTML report + traces for smoke failures (see playwright.config.ts).
      - name: Upload Playwright report on failure
        if: failure() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            services/web-app/playwright-report/
            services/web-app/test-results/
          retention-days: 7

      - name: 🔐 Run preview access gate tests
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.paths.outputs.code == 'true') }}
        working-directory: services/web-app
        env:
          CI: true
