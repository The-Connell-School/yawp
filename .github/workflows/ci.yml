# CI: pull_request synchronize runs full test matrix including Playwright E2E (locked preview evidence).
name: CI
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  paths:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      preview_tooling: ${{ steps.filter.outputs.preview_tooling }}
      prisma: ${{ steps.filter.outputs.prisma }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🔍 Paths filter
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            # scripts/** is included in the core code filter so the Prisma job
            # runs deployment-contract and mock-contract tests on script-only PRs.
            # These tests live under scripts/ and must execute even when no
            # packages/** or services/** paths changed.
            code:
              - 'services/**'
              - 'packages/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'pnpm-lock.yaml'
              - 'yarn.lock'
              - 'package-lock.json'
              - 'tsconfig*'
              - 'bin/**'
              - 'Dockerfile*'
              - 'bunfig.toml'
              - 'playwright.config.*'
            preview_tooling:
              - 'scripts/preview/**'
            prisma:
              - 'packages/prisma/**'
  # CI names every test file it runs, so a test file that is merely present never executes.
  # scripts/preview/*.test.js sat unrun for exactly that reason. It matters most here:
  # enforce-cap.sh removes trees as root before every deploy, and the ownership case it
  # guards can only be reproduced where bind mounts pass real UIDs through — which is
  # Linux, not a macOS workstation. This job is where that coverage actually happens.
  validate-preview-tooling:
    needs: [paths]
    name: Preview tooling
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⏭️ Skip (no preview tooling changes)
        if: ${{ needs.paths.outputs.preview_tooling != 'true' }}
        run: echo "No scripts/preview changes; skipping heavy steps."

      - name: 📥 Setup Bun
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.4.4'

      - name: 💾 Cache bun install
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        run: bun install --frozen-lockfile

      # The root-owned-build-output test needs the image the preview host itself runs.
      - name: 🐳 Pull the preview runtime image
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        run: docker pull oven/bun:1.4.4

      # Fail rather than skip if the runner cannot produce root-owned files: a silent skip
      # here would leave the regression uncovered everywhere.
      - name: 🧪 Preview tooling tests
        if: ${{ needs.paths.outputs.preview_tooling == 'true' }}
        env:
          ENFORCE_CAP_REQUIRE_ROOT_OWNERSHIP: '1'
          # Exercise the real Postgres role/ACL migration on Linux. Local macOS runs
          # may leave this opt-in because the test launches its own Postgres container.
          PREVIEW_DATABASE_ROLE_INTEGRATION: '1'
        run: bun test ./scripts/preview/ --timeout 180000

  validate-prisma-migrations:
    needs: [paths]
    name: Prisma migrations
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16@sha256:f9d1e581cde3e4c8bc696b07e6f7b7aea1d41014b33a52b27990762daae61beb # postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⏭️ Skip (no Prisma or core/code changes)
        if: ${{ !(needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true') }}
        run: echo "No packages/prisma changes; skipping heavy steps."

      - name: 📥 Setup Bun
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.4.4'

      - name: 💾 Cache bun install
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun install --frozen-lockfile

      # bunfig.toml preloads services/web-app/test-preload.ts for every `bun test` run in
      # this repo, and that preload imports ~/utils/auth.server, which imports @app/prisma.
      # The generated client therefore has to exist before the first test step, not just
      # before the migration steps below. `prisma generate` reads the schema only — it does
      # not connect — so it can run before the validation database is created.
      - name: ⚙️ Generate Prisma Client
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun prisma generate

      - name: 🧪 Validate deployment contract
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./scripts/deployment-contract.test.ts ./scripts/preview/demo-ecr-deploy.test.ts ./scripts/preview/demo-internal-api-config.test.ts ./scripts/preview/render-compose.test.js ./scripts/preview/demo-mail-config.test.ts ./scripts/worktree-local-setup.test.ts ./scripts/preview/deploy-log-secrets.test.js ./scripts/preview/redact-deploy-logs.test.js --max-concurrency=2

      - name: 🧪 Validate Blackboard LTI mock
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./scripts/blackboard-lti-mock/ --timeout 60000

      - name: 🧪 Validate read-only impersonation contract
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./scripts/read-only-impersonation-contract.test.ts

      - name: 🧰 Install Postgres client
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 🛠️ Create migration validation database
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres yawp_migration_ci

      - name: 🧪 Validate teacher training assignment migration data swap
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./packages/prisma/scripts/teacher-training-assignment-migration.test.ts

      # Daily Pages consolidation: migration simulation + Class Starter seed contract.
      - name: 🧪 Daily Pages engagement migration + Class Starter seed
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: |
          bun test ./packages/prisma/scripts/daily-pages-engagement-migration.test.ts
          bun test ./packages/prisma/scripts/daily-pages-engagement-migration.integration.test.ts
          bun test ./packages/prisma/scripts/apply-daily-pages-engagement-v2-seed.test.ts
          bun test ./packages/prisma/scripts/seed-class-starter-assignment-type.test.ts

      - name: 🧱 Apply Prisma migrations
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun prisma migrate deploy

      - name: 🧪 Exit ticket bootstrap migration idempotency
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./packages/prisma/scripts/exit-ticket-bootstrap-migration.test.ts
      - name: 🧪 yawp_admin internal SELECT revoke migration contract
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./packages/prisma/migrations/20261011121500_revoke_yawp_admin_internal_select/migration.test.ts

      - name: 🧪 Free tier bundle seed connection (tunnel TLS)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./packages/prisma/scripts/seed-free-tier-bundle-assignment-types.test.ts

      - name: 🌱 Seed free tier bundle assignment types
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun run --cwd packages/prisma seed-free-tier-bundle-assignment-types

      # CI names every test file it runs, and nothing ran services/web-app/app/**
      # unit tests: the rate limiter, client-IP and free-tier tests were present but
      # never executed. These need the migrated database above (real SQL), so they
      # live in this job. Add new web-app test files here.
      - name: 🧪 Free-tier Postgres integration (isolated from prisma mocks)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          FREE_TIER_DB_TESTS: '1'
          FREE_TIER_LINK_HMAC_SECRET: ci-free-tier-link-hmac-secret-key-32b
          PRIMARY_APP_URL: https://yawp.test
          RESEND_API_KEY: ''
          RESEND_FROM_EMAIL: ''
          EMAIL_PROVIDER: resend
        run: >-
          bun test
          ./packages/prisma/scripts/free-tier-real-db.integration.test.ts
          ./services/web-app/app/utils/free-tier-class-create-route.real-db.integration.test.ts
          ./services/web-app/app/utils/assignment-quota.real-db.integration.test.ts
          ./services/web-app/app/domain/free-tier/approval-flow.integration.test.ts
          ./services/web-app/app/domain/free-tier/approval-flow-pass1-send.integration.test.ts
          ./services/web-app/app/domain/free-tier/approval.integration.test.ts
          ./services/web-app/app/domain/free-tier/service.integration.test.ts
          ./services/web-app/app/routes/api.free-tier.waitlist/route.integration.test.ts
          ./services/web-app/app/domain/free-tier/site-license-locked-tiles.join-flow.integration.test.ts
          ./services/web-app/app/dev-panel/dev-panel-feedback.server.integration.test.ts

      - name: Free tier class preparation (isolated Postgres)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          CLASS_STEP_DB_TESTS: '1'
        run: >-
          bun test --max-concurrency=2
          ./services/web-app/app/domain/free-tier/class-preparation.test.ts
          ./services/web-app/app/domain/free-tier/class-preparation.real-db.integration.test.ts

      - name: Flagged approval delivery and route regressions
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          APPROVAL_V2_DB_TESTS: '1'
          FREE_TIER_JUMP_DB_TESTS: '1'
          FREE_TIER_LINK_HMAC_SECRET: ci-free-tier-link-hmac-secret-key-32b
          PRIMARY_APP_URL: https://yawp.test
        run: |
          bun test --max-concurrency=2 ./services/web-app/app/domain/free-tier/approval-v2.real-db.integration.test.ts
          bun test --max-concurrency=2 ./services/web-app/app/domain/free-tier/application-id-opaque-hash-verified.test.ts
          bun test --max-concurrency=2 ./services/web-app/app/domain/free-tier/admin-token-s9a-actions.test.ts
          bun test --max-concurrency=2 ./services/web-app/app/domain/free-tier/approval-deny.integration.test.ts
          bun test --max-concurrency=2 ./services/web-app/app/routes/app.free-tier.pending/route.v2.test.tsx
          bun test --max-concurrency=2 ./services/web-app/app/routes/free.admin.approve/route.v2.test.tsx
          bun test --max-concurrency=2 ./services/web-app/app/dev-panel/free-tier-jump.pending.real-db.integration.test.ts
          bun test --max-concurrency=2 ./services/web-app/app/dev-panel/free-tier-jump.approved.real-db.integration.test.ts

      - name: Free-tier approval suppress-email (isolated prisma mocks)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        run: bun test ./services/web-app/app/domain/free-tier/approval-flow.suppress-email.server.test.ts

      - name: 🧪 Free-tier operator cap denial persistence (isolated)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          FREE_TIER_DB_TESTS: '1'
          PRIMARY_APP_URL: https://yawp.test
          RESEND_API_KEY: ''
          RESEND_FROM_EMAIL: ''
          EMAIL_PROVIDER: resend
        run: bun test --max-concurrency=2 ./services/web-app/app/domain/free-tier/operator-caps.integration.test.ts

      - name: 🧪 Free-tier first essay concurrency and savepoint recovery (isolated)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          FREE_TIER_DB_TESTS: '1'
        run: bun test --max-concurrency=2 ./services/web-app/app/domain/free-tier/first-essay-analytics.integration.test.ts

      - name: 🧪 Feature flag Postgres integration (isolated from prisma mocks)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          FEATURE_FLAG_DB_TESTS: '1'
        run: >-
          bun test --max-concurrency=2
          ./services/web-app/app/domain/feature-flags/feature-flags.integration.test.ts

      - name: 🧪 Web app unit + DB tests (rate limits, client IP, free tier)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          RATE_LIMIT_DB_TESTS: '1'
          FREE_TIER_DB_TESTS: '1'
          FREE_TIER_LINK_HMAC_SECRET: ci-free-tier-link-hmac-secret-key-32b
          PRIMARY_APP_URL: https://yawp.test
          RESEND_API_KEY: ''
          RESEND_FROM_EMAIL: ''
          EMAIL_PROVIDER: resend
          PREVIEW_SEAT_TOP_UP: '0'
          RUBRIC_CATALOG_DB_TESTS: '1'
          FEATURE_FLAG_DB_TESTS: '1'
        run: >-
          bun test
          ./services/web-app/app/domain/rubrics/rubric-catalog.test.ts
          ./services/web-app/app/domain/rubrics/rubric-catalog.integration.test.ts
          ./services/web-app/app/domain/rubrics/rubric-release.integration.test.ts
          ./services/web-app/app/domain/rubrics/rubric-release.server.test.ts
          ./services/web-app/app/utils/internal-rubric-catalog-http.server.test.ts
          ./services/web-app/app/utils/ip.server.test.ts
          ./services/web-app/app/utils/rate-limit.server.test.ts
          ./services/web-app/app/utils/login-rate-limit-target.test.ts
          ./services/web-app/app/utils/rate-limit.false-positive.test.ts
          ./services/web-app/app/utils/rate-limit.responses.test.ts
          ./services/web-app/app/utils/preview-access-rate-limit.server.test.ts
          ./services/web-app/app/utils/internal-free-tier-http.server.test.ts
          ./services/web-app/app/utils/mock-admin-environment.test.ts
          $(find ./services/web-app/app/domain/free-tier -type f -name '*.test.ts' ! -name 'student-join.server.test.ts' ! -name 'inapp-usage.server.test.ts' ! -name 'monthly-policy.test.ts' ! -name 'locked-preview.server.test.ts' ! -name 'teaching-access-shell.server.test.ts' ! -name 'email.server.test.ts' ! -name 'demo-signup-admin-email.test.ts' ! -name 'admin-link-gate.server.test.ts' ! -name 'admin-approval-email-facts.test.ts' ! -name 'approval-flow-pass1-send.test.ts' ! -name 'approval-flow.suppress-email.server.test.ts' ! -name 'application-id-opaque-hash-verified.test.ts' ! -name 'admin-token-s9a-actions.test.ts' ! -name 'service.create-token-idempotency.test.ts' ! -name 'posthog-*.test.ts' ! -name 'service.analytics.server.test.ts' ! -name 'public-onboarding.route.test.ts' ! -name 'provision.analytics.server.test.ts' ! -name '*.integration.test.ts')
          ./services/web-app/app/routes/app/sidebar-nav.reporter.test.ts
          ./packages/prisma/preview-access-code.free-classroom.test.ts
          ./packages/prisma/scripts/preview-seats.test.ts
          ./services/web-app/app/domain/submissions/student-submission-grade-visibility.server.test.ts
          './services/web-app/app/routes/app_.submissions_.$submissionId/route.loader.test.ts'
          './services/web-app/app/routes/app_.submissions_.$submissionId/submission-rubric-config.server.test.ts'
          './services/web-app/app/domain/grading/rubric-display.test.ts'
          './services/web-app/app/domain/assignment-types/daily-pages-engagement-rubric.test.ts'
          './services/web-app/app/routes/app.assignment-types.$id/route.test.ts'
          './services/web-app/app/routes/app_.documents_.$id/route.test.ts'
          ./services/web-app/e2e/decode-router-data.test.ts
          # decode-router-data: turbo .data assertions in student.unreleased-grade-loader-privacy E2E

      - name: Locked preview policy and authentication (isolated mocks)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./services/web-app/app/domain/free-tier/locked-preview.test.ts

      - name: Locked preview request enforcement (isolated mocks)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./services/web-app/app/domain/free-tier/locked-preview.server.test.ts

      - name: Teaching access shell (isolated mocks)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./services/web-app/app/domain/free-tier/teaching-access-shell.server.test.ts

      - name: Locked preview legacy public enrollment (isolated mocks)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test --max-concurrency=2 ./services/web-app/app/routes/auth.inv.onboard-student/ua-onboarding.test.ts

      - name: Locked preview shared writers and tools (real database)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
          LOCKED_PREVIEW_DB_TESTS: '1'
        run: |
          bun test --max-concurrency=2 ./services/web-app/app/domain/free-tier/locked-preview.real-db.integration.test.ts
          bun test --max-concurrency=2 ./services/web-app/app/utils/cookies.organization-classes-table.test.ts
          bun test --max-concurrency=2 ./services/web-app/app/domain/free-tier/teaching-secrets-loader.integration.test.ts

      - name: 🧪 Free-tier locked teaching UI (isolated)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        working-directory: services/web-app
        run: |
          set -e
          bun test app/components/free-tier/locked-teaching-control.test.tsx
          bun test app/components/free-tier/teaching-access-banner.test.tsx
          bun test app/components/free-tier/teaching-access-toasts.test.tsx
          bun test app/components/assignments/assignment-creation-locked-picker.test.tsx
          bun test app/components/site-license-lock-button.test.tsx
          bun test app/components/site-license-locked-assignment-tile.test.tsx
          bun test app/components/free-account-usage.locked-tiles.test.tsx
          bun test app/components/free-tier/preview-assignment-creation-control.test.tsx

      - name: 🧪 Free-account in-app usage adapter (isolated; mocks prisma)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./services/web-app/app/domain/free-tier/inapp-usage.server.test.ts

      - name: Monthly free-tier consumer policy (isolated; mocks prisma)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./services/web-app/app/domain/free-tier/monthly-policy.test.ts

      - name: Monthly operations and durable retries (isolated PostgreSQL)
        if: ${{ needs.paths.outputs.prisma == 'true' || needs.paths.outputs.code == 'true' }}
        env:
