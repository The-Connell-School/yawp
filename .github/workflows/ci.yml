  # Smoke specs run serially (workers: 1) and share one database per runner.
  # CI assigns whole spec files to shards (see e2e/smoke-specs.ts) so heavy files
  # like teacher.lesson-planner.spec.ts do not skew Playwright test-level sharding.
  e2e-smoke:
    needs: [paths]
    if: ${{ needs.paths.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: 🧪 E2E smoke (shard ${{ matrix.shard }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16@sha256:f9d1e581cde3e4c8bc696b07e6f7b7aea1d41014b33a52b27990762daae61beb # postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.4.4'

      - name: 💾 Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e

      # Keyed on the resolved version from bun.lock so lockfile bumps invalidate stale browsers.

      - name: 🔖 Resolve Playwright version
        id: playwright-version
        run: |
          echo "version=$(bash scripts/ci/resolve-playwright-version.sh)" >> "$GITHUB_OUTPUT"

      - name: 💾 Restore Playwright browsers cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      # On cache hit, browsers live under ~/.cache/ms-playwright; only sync OS deps.
      # On miss, download chromium with deps. Only shard 1 saves the shared cache entry.

      - name: Install Playwright chromium
        working-directory: services/web-app
        timeout-minutes: 28
        env:
          PLAYWRIGHT_INSTALL_ATTEMPT_TIMEOUT: 12m
        run: bash ../../scripts/ci/install-playwright-chromium.sh "${{ steps.playwright-cache.outputs.cache-hit }}"

      - name: 💾 Save Playwright browsers cache
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' && matrix.shard == 1 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: 🧪 Run Playwright tests
        working-directory: services/web-app
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e
          FREE_TIER_LINK_HMAC_SECRET: ci-free-tier-link-hmac-secret-key-32b
          PRIMARY_APP_URL: http://127.0.0.1:5173
          RESEND_API_KEY: ''
          RESEND_FROM_EMAIL: ''
          TRIAL_STATUS_SHOTS: test-results/trial-status
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: bun run test:e2e:smoke -- --shard=${{ matrix.shard }} --reporter=blob,list

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: services/web-app/blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload free classroom status evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: free-classroom-status-evidence-${{ matrix.shard }}
          path: services/web-app/test-results/trial-status/
          if-no-files-found: ignore
          retention-days: 7

      # HTML report + traces for smoke failures (see playwright.config.ts).

      - name: Upload test results on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ github.run_id }}-${{ matrix.shard }}
          path: services/web-app/test-results/
          retention-days: 7

  e2e-locked-preview:
    needs: [paths]
    if: ${{ needs.paths.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: 🧪 Free-tier locked preview browser
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:f9d1e581cde3e4c8bc696b07e6f7b7aea1d41014b33a52b27990762daae61beb # postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.4.4'

      - name: 💾 Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
