name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  validate-terraform-infra-pr:
    name: Terraform validate (infra-pr)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform validate
        run: terraform -chdir=infra-pr init -backend=false && terraform -chdir=infra-pr validate

  typecheck-web-app:
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: ⎔ Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📥 Download deps
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        run: bun install

      - name: ⚙️ Generate Prisma Client
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_typecheck

      - name: 🔎 Type check
        run: bun web-app:typecheck

  e2e-web-app:
    name: 🧪 E2E Tests (Playwright)
    runs-on: ubuntu-22.04
    needs: [typecheck-web-app]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: ⎔ Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        run: bun install

      - name: ⚙️ Generate Prisma Client
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e

      - name: Install Playwright browsers
        working-directory: services/web-app
        run: npx --yes playwright install --with-deps chromium firefox

      - name: 🧪 Run Playwright tests
        working-directory: services/web-app
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e
        run: bun run test:e2e:smoke
