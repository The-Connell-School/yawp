name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  # CI names every test file it runs, so a test file that is merely present never executes.
  # scripts/preview/*.test.js sat unrun for exactly that reason. It matters most here:
  # enforce-cap.sh removes trees as root before every deploy, and the ownership case it
  # guards can only be reproduced where bind mounts pass real UIDs through — which is
  # Linux, not a macOS workstation. This job is where that coverage actually happens.
  validate-preview-tooling:
    name: Preview tooling
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # The root-owned-build-output test needs the image the preview host itself runs.
      - name: 🐳 Pull the preview runtime image
        run: docker pull oven/bun:1.3.1

      # Fail rather than skip if the runner cannot produce root-owned files: a silent skip
      # here would leave the regression uncovered everywhere.
      - name: 🧪 Preview tooling tests
        env:
          ENFORCE_CAP_REQUIRE_ROOT_OWNERSHIP: '1'
          # Exercise the real Postgres role/ACL migration on Linux. Local macOS runs
          # may leave this opt-in because the test launches its own Postgres container.
          PREVIEW_DATABASE_ROLE_INTEGRATION: '1'
        run: bun test ./scripts/preview/ --timeout 180000

  validate-release-gate:
    name: Release gate unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3
      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧪 Run release gate tests
        run: bun test ./scripts/release-gate/ --timeout 30000

  validate-prisma-migrations:
    name: Prisma migrations
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # bunfig.toml preloads services/web-app/test-preload.ts for every `bun test` run in
      # this repo, and that preload imports ~/utils/auth.server, which imports @app/prisma.
      # The generated client therefore has to exist before the first test step, not just
      # before the migration steps below. `prisma generate` reads the schema only — it does
      # not connect — so it can run before the validation database is created.
      - name: ⚙️ Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun prisma generate

      - name: 🧪 Validate deployment contract
        run: bun test ./scripts/deployment-contract.test.ts

      - name: 🧪 Validate Blackboard LTI mock
        run: bun test ./scripts/blackboard-lti-mock/ --timeout 60000

      - name: 🧪 Validate read-only impersonation contract
        run: bun test ./scripts/read-only-impersonation-contract.test.ts

      - name: 🧰 Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 🛠️ Create migration validation database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres yawp_migration_ci

      - name: 🧪 Validate teacher training assignment migration data swap
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun test ./packages/prisma/scripts/teacher-training-assignment-migration.test.ts

      - name: 🧱 Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun prisma migrate deploy

      - name: 🎨 Backfill class artwork keys
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun run --cwd packages/prisma backfill-class-art-key

      - name: 🧪 Assignment type release gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun run --cwd packages/prisma assignment-type-release-gate

      # Last, because it truncates every table before it writes.
      #
      # The seed is what a preview runs against a fresh database, and until now
      # nothing ran it before a preview did. `packages/prisma/scripts` is outside
      # the web app's tsconfig, so typecheck does not reach it either — a call
      # that no longer matches its function surfaced as a failed deploy rather
      # than a failed check. This runs the same sequence against the same kind of
      # database.
      #
      # It does not catch everything the deploy can hit: a package the Prisma
      # workspace imports without declaring resolves fine here, because a plain
      # install hoists it to the root, and only fails where node_modules is laid
      # out differently. Declaring what the seed imports is the guard for that.
      - name: 🌱 Seed local-dev data
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_ci
        run: bun run --cwd packages/prisma seed-local-dev

  typecheck-web-app:
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: ⎔ Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: 📥 Download deps
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_typecheck

      - name: 🔎 Type check
        run: bun web-app:typecheck

  e2e-web-app:
    name: 🧪 E2E Tests (Playwright)
    runs-on: ubuntu-22.04
    # The browser download hung for five hours on 2026-08-18 and would have run
    # to GitHub's six-hour default before failing. Nothing about this job is
    # worth half a day of a runner: the tests themselves take about seven
    # minutes, so anything past half an hour is wedged, not slow.
    timeout-minutes: 30
    needs: [typecheck-web-app, validate-prisma-migrations]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: ⎔ Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e

      # Keyed on the resolved version rather than a hardcoded one, so a bump in
      # package.json invalidates the cache instead of restoring browsers that no
      # longer match the runner.
      - name: 🔖 Resolve Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Chromium only. `test:e2e:smoke` runs `--project=chromium` and the
      # preview-access config defines a single chromium project, so Firefox was
      # downloaded on every run and never launched.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: services/web-app
        timeout-minutes: 10
        run: npx --yes playwright install --with-deps chromium

      # The cache holds the browsers, not the apt packages they link against, so
      # a restored cache still needs the system libraries putting back.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: services/web-app
        timeout-minutes: 10
        run: npx --yes playwright install-deps chromium

      - name: 🧪 Run Playwright tests
        working-directory: services/web-app
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e
        run: bun run test:e2e:smoke

      - name: 🔐 Run preview access gate tests
        working-directory: services/web-app
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e
        run: bun run test:e2e:preview-access
