  typecheck-web-app:
    needs: [paths]
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    env:
      YAWP_CI_TYPECHECK_NO_DATABASE: '1'
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⏭️ Skip (no code changes)
        if: ${{ needs.paths.outputs.code != 'true' }}
        run: echo "No code changes; skipping heavy steps."

      - name: ⎔ Setup node
        if: ${{ needs.paths.outputs.code == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: 📥 Download deps
        if: ${{ needs.paths.outputs.code == 'true' }}
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.4.4'

      - name: 💾 Cache bun install
        if: ${{ needs.paths.outputs.code == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        if: ${{ needs.paths.outputs.code == 'true' }}
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        if: ${{ needs.paths.outputs.code == 'true' }}
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_typecheck

      - name: 🔎 Type check
        if: ${{ needs.paths.outputs.code == 'true' }}
        run: bun web-app:typecheck

      # CI did not run any web-app unit tests before; name the AI usage log
      # suites here so a regression in attribution or IP hashing fails the PR.
      - name: 🧪 AI usage log unit tests
        if: ${{ needs.paths.outputs.code == 'true' }}
        working-directory: services/web-app
        run: bun test app/utils/ai-usage-log.server.test.ts app/utils/getLLMCompletion/getLLMCompletion.test.ts

      - name: 🧪 E2E smoke shard assignment guard
        if: ${{ needs.paths.outputs.code == 'true' }}
        working-directory: services/web-app
        run: bun test e2e/smoke-specs.test.ts e2e/test-helpers.manifest-console.test.ts

      - name: Teacher training API contracts
        if: ${{ needs.paths.outputs.code == 'true' }}
        run: CI=1 ./bin/project test --profile internal-teacher-trainings --json

      - name: Assignment type write API contracts
        if: ${{ needs.paths.outputs.code == 'true' }}
        run: CI=1 ./bin/project test --profile internal-assignment-type-writes --json

      - name: 🧪 Free-tier spend admission and caller denials (isolated)
