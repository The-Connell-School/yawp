        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e

      # Keyed on the resolved version rather than a hardcoded one, so a bump in
      # package.json invalidates the cache instead of restoring browsers that no
      # longer match the runner.

      - name: 🔖 Resolve Playwright version
        id: playwright-version
        working-directory: services/web-app
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Chromium only. On a browser cache hit, install the binary only — apt deps
      # are already on the runner and `install-deps` has timed out on cache hits.

      - name: Install Playwright chromium
        working-directory: services/web-app
        timeout-minutes: 15
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx --package "@playwright/test@${version}" playwright install chromium
          else
            bunx --package "@playwright/test@${version}" playwright install --with-deps chromium
          fi

      - name: Verify demo feedback headless browser executable
        working-directory: services/web-app
        env:
          TMPDIR: ${{ runner.temp }}/demo-feedback
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/demo-feedback/bun-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/demo-feedback/cache
        run: |
          mkdir -p "$TMPDIR"
          version=$(node -p "require('@playwright/test/package.json').version")
          actual_version=$(bun x playwright --version)
          if [ "$actual_version" != "Version $version" ]; then
            echo "::error::Fixture runner $actual_version does not match installed Playwright $version"
            exit 1
          fi
          shell_dir=$(bun x playwright install --dry-run --only-shell chromium | sed -n 's/^ *Install location: *\(.*chromium_headless_shell[^ ]*\) *$/\1/p')
          executable="$shell_dir/chrome-headless-shell-linux64/chrome-headless-shell"
          if [ -z "$shell_dir" ] || [ ! -x "$executable" ]; then
            echo "::error::Missing Playwright $version chrome-headless-shell executable: $executable (PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH)"
            exit 1
          fi

      - name: Demo feedback local fixture browser regression
        env:
          CI: '1'
          # The fixture targets IPv4; Vite's default localhost bind must match it.
          NODE_OPTIONS: --dns-result-order=ipv4first
          TMPDIR: ${{ runner.temp }}/demo-feedback
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/demo-feedback/bun-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/demo-feedback/cache
          RECORD_PORT_APP: '5489'
          RECORD_PORT_DATABASE: '54489'
          RECORD_PORT_LTI_MOCK: '9789'
          YAWP_ENVIRONMENT: demo
          TESTER_FEEDBACK_ENABLED: 'true'
          RESEND_API_KEY: ''
          RESEND_FROM_EMAIL: ''
        run: |
          mkdir -p "$TMPDIR"
          cleanup() {
            ./bin/project dev stop --json || true
            if [ -f .worktree-local/config.env ]; then
              source .worktree-local/config.env
              docker rm -f "$CONTAINER_NAME" || true
              docker volume rm "$VOLUME_NAME" || true
            fi
          }
          trap cleanup EXIT
          ./bin/project bootstrap --fresh --json
          ./bin/project fixture verify local-dev --json
          ./bin/project dev start --json
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5489/ > /dev/null
          ./bin/project test --profile demo-feedback-browser --json

      - name: 🔐 Run preview access gate tests
        working-directory: services/web-app
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e
        run: bun run test:e2e:preview-access

      - name: Upload Playwright results on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-checks-results-${{ github.run_id }}
          path: |
            services/web-app/test-results/
            services/web-app/playwright-report/
          retention-days: 7

  # One HTML report for all smoke shards (non-gating; download the artifact on failure).
  e2e-report:
    needs: [e2e-smoke]
    if: ${{ !cancelled() && needs.e2e-smoke.result != 'skipped' }}
    name: 📊 Merge E2E smoke reports
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.4.3'

      - name: 💾 Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📥 Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: services/web-app/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: 🧩 Merge into one HTML report
        working-directory: services/web-app
        run: |
          if ls all-blob-reports/*.zip >/dev/null 2>&1; then
            bun x playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "No blob reports to merge."
          fi

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: services/web-app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Keeps the original check name. Passes when every E2E job passed, or when
  # they were skipped on purpose (draft PR or no code changes).
  e2e-web-app:
    needs: [paths, e2e-smoke, e2e-signon, e2e-browser-checks]
    if: ${{ always() }}
    name: 🧪 E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - name: ✅ Check E2E results
        env:
          RESULTS: ${{ needs.paths.result }} ${{ needs.e2e-smoke.result }} ${{ needs.e2e-signon.result }} ${{ needs.e2e-browser-checks.result }}
        run: |
          echo "paths, smoke, sign-on, browser checks: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::An E2E job ended with: $r"; exit 1 ;;
            esac
          done
