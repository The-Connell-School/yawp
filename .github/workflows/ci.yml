  # The smoke specs run serially (workers: 1) and share one database, so they are
  # split across runners instead: each shard gets its own Postgres service.
  e2e-smoke:
    needs: [paths]
    if: ${{ needs.paths.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: 🧪 E2E smoke (shard ${{ matrix.shard }})
    runs-on: ubuntu-22.04
    env:
      # Fixture steps isolate XDG_CACHE_HOME; keep browser install and lookup shared.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: ⎔ Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.4.3'

      - name: 💾 Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Generate Prisma Client
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e

      # Keyed on the resolved version rather than a hardcoded one, so a bump in
      # package.json invalidates the cache instead of restoring browsers that no
      # longer match the runner.

      - name: 🔖 Resolve Playwright version
        id: playwright-version
        working-directory: services/web-app
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Chromium only. On a browser cache hit, install the binary only — apt deps
      # are already on the runner and `install-deps` has timed out on cache hits.

      - name: Install Playwright chromium
        working-directory: services/web-app
        timeout-minutes: 15
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx --package "@playwright/test@${version}" playwright install chromium
          else
            bunx --package "@playwright/test@${version}" playwright install --with-deps chromium
          fi

      - name: 🧪 Run Playwright tests
        working-directory: services/web-app
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yop_e2e
          FREE_TIER_LINK_HMAC_SECRET: ci-free-tier-link-hmac-secret-key-32b
          PRIMARY_APP_URL: http://127.0.0.1:5173
          RESEND_API_KEY: ''
          RESEND_FROM_EMAIL: ''
          TRIAL_STATUS_SHOTS: test-results/trial-status
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: bun run test:e2e:smoke --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob,list

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: services/web-app/blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload free classroom status evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: free-classroom-status-evidence-${{ matrix.shard }}
          path: services/web-app/test-results/trial-status/
          if-no-files-found: ignore
          retention-days: 7

      # HTML report + traces for smoke failures (see playwright.config.ts).

      - name: Upload test results on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ matrix.shard }}
          path: services/web-app/test-results/
          retention-days: 7

