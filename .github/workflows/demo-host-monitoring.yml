name: Demo host monitoring

# Installs CloudWatch alarms for the dedicated demo host and verifies the
# metrics timer is publishing under Yawp/PreviewHost.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-environment
  cancel-in-progress: false

jobs:
  monitoring:
    runs-on: ubuntu-22.04
    environment: demo
    env:
      AWS_REGION: us-east-1
      PREVIEW_DOMAIN: ${{ vars.DEMO_DOMAIN || 'yawp.school' }}
      PREVIEW_HOST: ${{ vars.DEMO_HOST }}
      PREVIEW_ROOT: ${{ vars.DEMO_ROOT || '/srv/yawp-demo' }}
      PREVIEW_SSH_USER: ${{ vars.DEMO_SSH_USER || 'ec2-user' }}
      DEMO_INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
    steps:
      - name: Check configuration
        env:
          DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing DEMO_HOST"; exit 1; }
          test -n "$DEMO_SSH_PRIVATE_KEY" || { echo "Missing DEMO_SSH_PRIVATE_KEY"; exit 1; }

      - name: Checkout reviewed control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare SSH
        env:
          DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEMO_SSH_PRIVATE_KEY" > ~/.ssh/demo_key
          chmod 600 ~/.ssh/demo_key
          cat >> ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 120
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          grep -q "$PREVIEW_HOST" ~/.ssh/known_hosts || {
            echo "Could not reach demo host $PREVIEW_HOST over SSH" >&2
            exit 1
          }

      - name: Resolve demo instance id
        id: instance
        run: |
          set -euo pipefail
          if [[ -n "$DEMO_INSTANCE_ID" ]]; then
            instance_id="$DEMO_INSTANCE_ID"
          else
            instance_id="$(aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters "Name=ip-address,Values=$PREVIEW_HOST" \
              --query 'Reservations[0].Instances[0].InstanceId' \
              --output text)"
          fi
          [[ "$instance_id" =~ ^i-[0-9a-f]+$ ]] || {
            echo "Could not resolve demo instance id for $PREVIEW_HOST" >&2
            exit 1
          }
          echo "id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "Demo instance: $instance_id"

      - name: Provision demo host alarms
        run: |
          bash scripts/preview/provision-host-alarms.sh \
            "${{ steps.instance.outputs.id }}" \
            yawp-demo-host

      - name: Sync monitoring scripts and install metrics timer
        run: |
          set -euo pipefail
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_control="${PREVIEW_ROOT}/control/demo"
          ssh -i ~/.ssh/demo_key "$ssh_target" "mkdir -p '$remote_control/scripts/preview'"
          rsync -az \
            -e "ssh -i ~/.ssh/demo_key" \
            scripts/preview/publish-host-metrics.sh \
            scripts/preview/install-host-metrics.sh \
            scripts/preview/ensure-host-swap.sh \
            "$ssh_target:$remote_control/scripts/preview/"
          ssh -i ~/.ssh/demo_key "$ssh_target" \
            "PREVIEW_ROOT=$(printf '%q' "$PREVIEW_ROOT") bash $(printf '%q' "${remote_control}/scripts/preview/ensure-host-swap.sh")"
          ssh -i ~/.ssh/demo_key "$ssh_target" \
            "PREVIEW_ROOT=$(printf '%q' "$PREVIEW_ROOT") \
             HOST_METRICS_SCRIPT=$(printf '%q' "${remote_control}/scripts/preview/publish-host-metrics.sh") \
             HOST_METRICS_SERVICE=yawp-demo-metrics \
             bash $(printf '%q' "${remote_control}/scripts/preview/install-host-metrics.sh")"

      - name: Verify demo metrics are publishing
        run: |
          set -euo pipefail
          instance_id="${{ steps.instance.outputs.id }}"
          for attempt in $(seq 1 12); do
            count="$(aws cloudwatch get-metric-statistics \
              --region "$AWS_REGION" \
              --namespace Yawp/PreviewHost \
              --metric-name MemoryUsedPercent \
              --dimensions "Name=InstanceId,Value=${instance_id}" \
              --start-time "$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
              --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --period 60 \
              --statistics Average \
              --query 'length(Datapoints)' \
              --output text)"
            if [[ "$count" != "0" && "$count" != "None" ]]; then
              echo "Demo host metrics publishing (${count} recent datapoints)"
              exit 0
            fi
            echo "Waiting for demo metrics (attempt ${attempt}/12)..."
            sleep 15
          done
          echo "Demo host metrics did not appear within 3 minutes" >&2
          exit 1

      - name: Verify alarm wiring
        run: bash scripts/preview/verify-host-alarms.sh
