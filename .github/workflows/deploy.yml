name: 🚀 Deploy
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  # Queue production deploys so a newer push cannot interrupt a non-transactional
  # CREATE INDEX CONCURRENTLY migration and leave its Prisma ledger unresolved.
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  validate-prisma-migrations:
    name: Prisma migrations
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 📥 Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        run: bun install

      - name: 🧪 Validate deployment contract
        run: bun test ./scripts/deployment-contract.test.ts

      - name: 🧰 Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 🛠️ Create migration validation database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres yawp_migration_deploy

      - name: 🧪 Validate teacher training assignment migration data swap
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_deploy
        run: bun test ./packages/prisma/scripts/teacher-training-assignment-migration.test.ts

      - name: ⚙️ Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_deploy
        run: bun prisma generate

      - name: 🧱 Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_deploy
        run: bun prisma migrate deploy

      - name: 🎨 Backfill class artwork keys
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_deploy
        run: bun run --cwd packages/prisma backfill-class-art-key

      - name: 🧪 Assignment type release gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_deploy
        run: bun run --cwd packages/prisma assignment-type-release-gate

  deploy-web-app-production:
    name: 🚀 Deploy Web App (Production)
    runs-on: ubuntu-22.04
    needs: [validate-prisma-migrations]

    environment:
      name: production
      url: https://yawp.school

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 📥 Download deps
        uses: oven-sh/setup-bun@v1

      - name: 📦 Install dependencies
        run: bun install

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔑 Prepare production bastion SSH key
        run: |
          mkdir -p ~/.ssh "$(dirname "${PROD_SSH_KEY_PATH}")"
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > "${PROD_SSH_KEY_PATH}"
          chmod 600 "${PROD_SSH_KEY_PATH}"
          ssh-keyscan -H "${PROD_SSH_HOST}" >> ~/.ssh/known_hosts
        env:
          PROD_SSH_KEY_PATH: ${{ runner.temp }}/yawp-production-bastion
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: 🧬 Generate Prisma client
        run: bun prisma:generate

      - name: 🧱 Apply production Prisma migrations
        run: bun prisma:migrate-remote production
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY_PATH: ${{ runner.temp }}/yawp-production-bastion
          PROD_MIGRATION_LOCK_TIMEOUT_MS: '5000'
          PROD_MIGRATION_STATEMENT_TIMEOUT_MS: '600000'
          PROD_MIGRATION_BLOCKING_TRANSACTION_AGE_MS: '5000'

      - name: 📦 Build Docker image
        run: bun web-app:docker:build

      - name: 🏷️ Tag Docker image
        run: bun web-app:docker:production:tag

      - name: 🚀 Push Docker image
        run: bun web-app:docker:production:push
