name: Preview host bootstrap

# Re-runs scripts/preview/bootstrap-host.sh on the shared preview host.
#
# The host is reachable only with PREVIEW_SSH_PRIVATE_KEY, which is write-only, so
# host-level changes cannot be applied from a workstation — they have to come through a
# workflow that holds the secret. bootstrap-host.sh is idempotent, so running it again is
# how the host picks up changes to Traefik or the shared Postgres.
#
# It does NOT touch any deployed preview: it rewrites the Traefik and Postgres compose
# files and brings those two back up. Preview containers keep running.

on:
  workflow_dispatch:

concurrency:
  group: preview-host-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    environment: preview-host
    env:
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      PREVIEW_ROOT: ${{ vars.PREVIEW_ROOT || '/srv/yawp-preview' }}
      PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER || 'ec2-user' }}
      PREVIEW_MAX_RUNNING: ${{ vars.PREVIEW_MAX_RUNNING || '8' }}
      PREVIEW_SLEEP_ENABLED: ${{ vars.PREVIEW_SLEEP_ENABLED || 'true' }}
      PREVIEW_DB_PASSWORD: ${{ secrets.PREVIEW_DB_PASSWORD }}
      PREVIEW_ACME_EMAIL: ${{ vars.PREVIEW_ACME_EMAIL || 'bryant@brock.software' }}
    steps:
      - name: Check configuration
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable PREVIEW_HOST"; exit 1; }
          test -n "$PREVIEW_DOMAIN" || { echo "Missing repository variable PREVIEW_DOMAIN"; exit 1; }
          test -n "$PREVIEW_SSH_PRIVATE_KEY" || { echo "Missing repository secret PREVIEW_SSH_PRIVATE_KEY"; exit 1; }

      - name: Checkout dispatched default-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare SSH
        env:
          PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_PRIVATE_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync the bootstrap script to the host
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/preview_key "${PREVIEW_SSH_USER}@${PREVIEW_HOST}" \
            "mkdir -p ${PREVIEW_ROOT}/bootstrap/scripts/preview"
          scp -i ~/.ssh/preview_key \
            scripts/preview/bootstrap-host.sh \
            scripts/preview/publish-host-metrics.sh \
            scripts/preview/wake-server.mjs \
            scripts/preview/wake-preview.sh \
            "${PREVIEW_SSH_USER}@${PREVIEW_HOST}:${PREVIEW_ROOT}/bootstrap/scripts/preview/"

      - name: Run bootstrap
        run: |
          set -euo pipefail
          shell_quote() { printf '%q' "$1"; }
          remote_env=(
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT")"
            "PREVIEW_DOMAIN=$(shell_quote "$PREVIEW_DOMAIN")"
            "PREVIEW_MAX_RUNNING=$(shell_quote "$PREVIEW_MAX_RUNNING")"
            "PREVIEW_SLEEP_ENABLED=$(shell_quote "$PREVIEW_SLEEP_ENABLED")"
            "PREVIEW_DB_PASSWORD=$(shell_quote "$PREVIEW_DB_PASSWORD")"
            "PREVIEW_ACME_EMAIL=$(shell_quote "$PREVIEW_ACME_EMAIL")"
          )
          ssh -i ~/.ssh/preview_key "${PREVIEW_SSH_USER}@${PREVIEW_HOST}" \
            "cd ${PREVIEW_ROOT}/bootstrap && ${remote_env[*]} bash scripts/preview/bootstrap-host.sh"
