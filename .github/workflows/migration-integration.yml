name: Migration Integration

on:
  pull_request:
    paths:
      - 'packages/prisma/**'
      - '.github/workflows/migration-integration.yml'
      - 'services/web-app/**'

jobs:
  migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f9d1e581cde3e4c8bc696b07e6f7b7aea1d41014b33a52b27990762daae61beb # postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: '1.4.4'
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: bun run --cwd packages/prisma prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_integration
      - name: Prepare migration integration database
        run: bun run --cwd packages/prisma prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_integration
      - name: Run migration integration test
        run: >-
          bun test --max-concurrency=2
          ./packages/prisma/scripts/free-tier-real-db.integration.test.ts
          ./packages/prisma/scripts/migration-integration.test.ts
          ./packages/prisma/scripts/instruction-fields-migration.integration.test.ts
          ./packages/prisma/scripts/holistic-migration-label.integration.test.ts
          ./packages/prisma/scripts/daily-pages-engagement-migration.integration.test.ts
          ./packages/prisma/scripts/dev-panel-class-simulation.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yawp_migration_integration

