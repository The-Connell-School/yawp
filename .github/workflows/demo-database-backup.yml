name: Demo database backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      backup_retention:
        description: 'Number of daily demo backups to retain (1-365)'
        type: string
        required: false
        default: '14'

concurrency:
  group: demo-environment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-22.04
    environment: demo
    env:
      PREVIEW_HOST: ${{ vars.DEMO_HOST }}
      PREVIEW_ROOT: ${{ vars.DEMO_ROOT || '/srv/yawp-demo' }}
      PREVIEW_SSH_USER: ${{ vars.DEMO_SSH_USER || 'ec2-user' }}
      BACKUP_RETENTION_COUNT: ${{ inputs.backup_retention || vars.DEMO_BACKUP_RETENTION || '14' }}
      BACKUP_S3_URI: ${{ vars.DEMO_BACKUP_S3_URI || 's3://yawp-preview-videos/demo-backups' }}
    steps:
      - name: Check backup configuration
        env:
          DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_HOST" || { echo "Missing repository variable DEMO_HOST"; exit 1; }
          test -n "$DEMO_SSH_PRIVATE_KEY" || { echo "Missing demo secret DEMO_SSH_PRIVATE_KEY"; exit 1; }
          [[ "$PREVIEW_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEMO_ROOT"; exit 1; }
          if [[ ! "$BACKUP_RETENTION_COUNT" =~ ^[1-9][0-9]{0,2}$ ]] \
            || (( BACKUP_RETENTION_COUNT < 1 || BACKUP_RETENTION_COUNT > 365 )); then
            echo "backup_retention must be between 1 and 365" >&2
            exit 1
          fi
          [[ "$BACKUP_S3_URI" =~ ^s3://[a-z0-9.-]+/[A-Za-z0-9._/-]+$ ]] || {
            echo "Invalid DEMO_BACKUP_S3_URI" >&2
            exit 1
          }

      - name: Prepare SSH
        env:
          DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEMO_SSH_PRIVATE_KEY" > ~/.ssh/demo_key
          chmod 600 ~/.ssh/demo_key
          ssh-keyscan -H "$PREVIEW_HOST" >> ~/.ssh/known_hosts

      - name: Create and retrieve validated backup
        id: backup
        run: |
          set -euo pipefail
          shell_quote() { printf '%q' "$1"; }
          ssh_target="${PREVIEW_SSH_USER}@${PREVIEW_HOST}"
          remote_script="${PREVIEW_ROOT}/ops/backup-database.sh"
          output="$(ssh -i ~/.ssh/demo_key "$ssh_target" \
            "PREVIEW_ROOT=$(shell_quote "$PREVIEW_ROOT") DATABASE_NAME=yawp_demo PREVIEW_POSTGRES_CONTAINER=preview-postgres BACKUP_KIND=scheduled BACKUP_RETENTION_COUNT=$(shell_quote "$BACKUP_RETENTION_COUNT") bash $(shell_quote "$remote_script")")"
          remote_file="$(awk -F= '/^BACKUP_FILE=/{print $2}' <<<"$output" | tail -1)"
          [[ "$remote_file" == "$PREVIEW_ROOT"/backups/yawp_demo-scheduled-*.dump ]] || {
            echo "Backup command returned an unexpected path" >&2
            exit 1
          }
          local_dir="$(mktemp -d)"
          local_file="$local_dir/$(basename "$remote_file")"
          scp -i ~/.ssh/demo_key "$ssh_target:$remote_file" "$local_file"
          scp -i ~/.ssh/demo_key "$ssh_target:${remote_file}.sha256" "${local_file}.sha256"
          expected="$(awk '{print $1}' "${local_file}.sha256")"
          actual="$(sha256sum "$local_file" | awk '{print $1}')"
          test "$actual" = "$expected" || { echo "Backup checksum mismatch" >&2; exit 1; }
          printf '%s  %s\n' "$actual" "$(basename "$local_file")" > "${local_file}.sha256"
          echo "local_file=$local_file" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$local_file")" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Copy backup off-host and retain newest set
        env:
          LOCAL_FILE: ${{ steps.backup.outputs.local_file }}
          FILENAME: ${{ steps.backup.outputs.filename }}
        run: |
          set -euo pipefail
          destination="${BACKUP_S3_URI%/}"
          aws s3 cp "$LOCAL_FILE" "$destination/$FILENAME" --sse AES256 --only-show-errors
          aws s3 cp "${LOCAL_FILE}.sha256" "$destination/${FILENAME}.sha256" --sse AES256 --only-show-errors

          bucket_and_prefix="${destination#s3://}"
          bucket="${bucket_and_prefix%%/*}"
          prefix="${bucket_and_prefix#*/}/"
          versioned_keys_text="$(aws s3api list-object-versions \
            --bucket "$bucket" \
            --prefix "$prefix" \
            --query '[Versions[].Key, DeleteMarkers[].Key][]' \
            --output text)"
          dump_keys_text=''
          while IFS= read -r object_key; do
            [[ -n "$object_key" && "$object_key" != "None" ]] || continue
            dump_key="${object_key%.sha256}"
            [[ "$dump_key" == "$prefix"yawp_demo-scheduled-*.dump ]] || continue
            dump_keys_text+="${dump_key}"$'\n'
          done <<<"$(printf '%s\n' "$versioned_keys_text" | tr '\t' '\n')"
          sorted_dump_keys="$(printf '%s' "$dump_keys_text" | LC_ALL=C sort -ur)"
          keys=()
          while IFS= read -r key; do
            [[ -n "$key" ]] && keys+=("$key")
          done <<<"$sorted_dump_keys"

          for ((index = BACKUP_RETENTION_COUNT; index < ${#keys[@]}; index++)); do
            key="${keys[$index]}"
            [[ "$key" == "$prefix"yawp_demo-scheduled-*.dump ]] || {
              echo "Refusing to delete unexpected S3 key: $key" >&2
              exit 1
            }
            for object_key in "$key" "${key}.sha256"; do
              versions_text="$(aws s3api list-object-versions \
                --bucket "$bucket" \
                --prefix "$object_key" \
                --query '[Versions[].[Key,VersionId], DeleteMarkers[].[Key,VersionId]][]' \
                --output text)"
              while read -r returned_key version_id; do
                [[ "$returned_key" == "$object_key" ]] || continue
                [[ -n "$version_id" && "$version_id" != "None" ]] || continue
                aws s3api delete-object \
                  --bucket "$bucket" \
                  --key "$object_key" \
                  --version-id "$version_id" >/dev/null
              done <<<"$versions_text"
            done
          done

          echo "Validated demo backup copied to $destination/$FILENAME"
